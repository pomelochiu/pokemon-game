<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="寶可夢挑戰">
    <meta name="theme-color" content="#f4f6fb">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>寶可夢拼音/認字挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 鎖定單一畫面，像原生 App 一樣不捲動 */
            overscroll-behavior: none;
            background: linear-gradient(180deg, #eef3fc 0%, #f8f9fc 100%);
            font-family: "Microsoft JhengHei", "PingFang TC", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
            padding-right: max(14px, env(safe-area-inset-right));
        }

        /* App 主容器：一屏到底均分上、中、下三區 */
        .game-shell {
            width: min(100%, 760px);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* 頂部 App 狀態列（星星計分 + 題號 + 模式切換） */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            padding: 4px 2px;
        }

        .app-badges {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-pill {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: clamp(15px, 2vw, 18px);
            font-weight: 800;
            color: #334155;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .badge-pill.star {
            border-color: #fde047;
            background: #fefce8;
            color: #854d0e;
        }

        #modeBtn {
            font-size: clamp(15px, 2vw, 18px);
            padding: 8px 16px;
            min-height: 44px;
            background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(156, 39, 176, 0.25);
            font-weight: bold;
            touch-action: manipulation;
            white-space: nowrap;
            transition: transform 0.12s ease;
        }

        #modeBtn:active {
            transform: scale(0.95);
        }

        /* 中央遊戲主舞台：自動適應剩餘高度 */
        .stage-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0; /* 允許在較矮螢幕自動微縮 */
            gap: clamp(10px, 2vh, 20px);
            padding: 6px 0;
        }

        .card-container {
            perspective: 1000px;
            height: min(38vh, 330px);
            max-width: 72vw;
            aspect-ratio: 7 / 10;
            flex-shrink: 1;
        }

        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
            background-color: white;
            border: 6px solid #ffcc00;
            overflow: hidden;
        }

        .card-back {
            background: radial-gradient(circle, #2b67ad 0%, #102d57 100%);
        }

        .pokeball {
            width: clamp(88px, 13vh, 135px);
            height: clamp(88px, 13vh, 135px);
            border-radius: 50%;
            background: linear-gradient(to bottom, #d22630 46%, #000000 46%, #000000 54%, #ffffff 54%);
            border: 6px solid #000000;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .pokeball::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28%;
            height: 28%;
            background: #ffffff;
            border-radius: 50%;
            border: 5px solid #000000;
        }

        .pokeball::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 11%;
            height: 11%;
            background: #ffffff;
            border-radius: 50%;
            border: 1px solid #dddddd;
        }

        .card-front {
            transform: rotateY(180deg);
        }

        .card-front img {
            width: 112%;
            height: 112%;
            max-width: none;
            max-height: none;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 題目字卡區（App 卡片式白底圓角框） */
        .word-card {
            width: 100%;
            background: #ffffff;
            border-radius: 22px;
            padding: clamp(10px, 1.8vh, 18px) 16px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(226, 232, 240, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .bopomofo-display {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(12px, 3vw, 26px);
            min-height: clamp(82px, 12vh, 114px);
            flex-wrap: wrap;
        }

        .char-block {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .char-block.symbol-only {
            justify-content: center;
        }

        .char-block.symbol-only .char-text {
            font-size: clamp(34px, 5vw, 54px);
            font-weight: 700;
        }

        .char-text {
            font-size: clamp(40px, 5.8vw, 64px);
            font-weight: bold;
            color: #1e293b;
            line-height: 1.1;
        }

        .zhuyin-col {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: 4px;
            font-size: clamp(19px, 2.5vw, 28px);
            color: #475569;
            line-height: 1.1;
            font-weight: bold;
        }

        .hide-zhuyin .zhuyin-col {
            visibility: hidden;
        }

        .bpmf-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tone-side {
            position: absolute;
            right: -0.7em;
            top: 60%;
            transform: translateY(-50%);
        }

        .tone-light {
            position: absolute;
            top: -0.8em;
            left: 50%;
            transform: translateX(-50%);
        }

        #statusMessage {
            width: 100%;
            font-size: clamp(17px, 2.4vw, 22px);
            color: #475569;
            min-height: 32px;
            margin-top: 6px;
            font-weight: bold;
            text-align: center;
            line-height: 1.35;
        }

        #statusMessage.success { color: #16a34a; }
        #statusMessage.close { color: #ea580c; }
        #statusMessage.retry { color: #475569; }
        #statusMessage.error { color: #dc2626; }

        /* 底部固定 App 操作列 */
        .controls {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* 麥克風主按鈕佔滿整排上方，方便單手或雙手拇指點擊 */
        #micBtn {
            grid-column: 1 / -1;
            font-size: clamp(21px, 3vw, 26px);
            min-height: 62px;
            border-radius: 18px;
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
        }

        button.action-btn {
            font-size: clamp(18px, 2.5vw, 22px);
            padding: 12px 18px;
            min-height: 54px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            touch-action: manipulation;
            white-space: nowrap;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        button.action-btn:active { transform: scale(0.97); }
        button.action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        button.action-btn.secondary {
            background: linear-gradient(135deg, #2196F3 0%, #1976d2 100%);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.25);
        }
        button.action-btn.outline {
            background-color: #ffffff;
            color: #475569;
            border: 2px solid #cbd5e1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        /* 平板 / 寬螢幕：三顆按鈕並排 */
        @media (min-width: 601px) {
            .controls {
                grid-template-columns: 2fr 1fr 1fr;
                gap: 14px;
            }
            #micBtn {
                grid-column: auto;
                min-height: 60px;
            }
            button.action-btn {
                min-height: 60px;
            }
        }

        /* 平板橫向模式特別優化 */
        @media (min-width: 768px) and (max-height: 850px) and (orientation: landscape) {
            .stage-area {
                flex-direction: row;
                justify-content: center;
                gap: 28px;
            }
            .card-container {
                height: min(56vh, 320px);
            }
            .word-card {
                width: auto;
                min-width: 320px;
                max-width: 440px;
                padding: 20px 24px;
            }
        }

        /* 答對慶祝紙花畫布 */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>

    <main class="game-shell">
        <div class="header-bar">
            <div class="app-badges">
                <div class="badge-pill star">⭐ <span id="starCount">0</span></div>
                <div class="badge-pill">第 <span id="questionNum">1</span> 題</div>
            </div>
            <button id="modeBtn" type="button">切換為：認字模式</button>
        </div>

        <div class="stage-area">
            <div class="card-container">
                <div class="card" id="pokemonCard">
                    <div class="card-face card-back">
                        <div class="pokeball"></div>
                    </div>
                    <div class="card-face card-front">
                        <img id="pokemonImage" src="" alt="Pokemon" decoding="async" fetchpriority="high">
                    </div>
                </div>
            </div>

            <div class="word-card">
                <div class="bopomofo-display" id="bopomofoText"></div>
                <div id="statusMessage">準備好了嗎？</div>
            </div>
        </div>

        <div class="controls">
            <button id="micBtn" class="action-btn" type="button">🎤 按下說話</button>
            <button id="showBtn" class="action-btn outline" type="button">看答案</button>
            <button id="nextBtn" class="action-btn secondary" type="button">下一題</button>
        </div>
    </main>

    <script src="dataset.js"></script>
    <script>
        /* =========================================================
         * App 體驗增強模組（PWA 離線註冊、計分進度、答對慶祝動畫）
         * ========================================================= */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.warn('[PWA] Service Worker 註冊略過:', err);
                });
            });
        }

        let appStarScore = 0;
        let appQuestionCount = 0;
        let currentQuestionScored = false;

        function updateAppCounters({ incrementQuestion = false, addStar = false } = {}) {
            if (incrementQuestion) {
                appQuestionCount++;
                currentQuestionScored = false;
                const qEl = document.getElementById('questionNum');
                if (qEl) qEl.textContent = appQuestionCount;
            }
            if (addStar && !currentQuestionScored) {
                currentQuestionScored = true;
                appStarScore++;
                const sEl = document.getElementById('starCount');
                if (sEl) sEl.textContent = appStarScore;
                launchConfetti();
            }
        }

        function launchConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#ffcc00', '#ff5252', '#4caf50', '#2196f3', '#ab47bc', '#ff9800'];
            const pieces = Array.from({ length: 55 }, () => ({
                x: canvas.width * (0.2 + Math.random() * 0.6),
                y: canvas.height * 0.35,
                vx: (Math.random() - 0.5) * 12,
                vy: -Math.random() * 10 - 4,
                size: Math.random() * 8 + 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                rot: Math.random() * 360,
                vRot: (Math.random() - 0.5) * 14
            }));

            let frame = 0;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.42; // 重力
                    p.rot += p.vRot;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    ctx.restore();
                });

                frame++;
                if (frame < 75) {
                    requestAnimationFrame(draw);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(draw);
        }

        /* =========================================================
         * 寶可夢拼音 / 認字挑戰 V16 - Production（原始核心邏輯完全保留）
         * ========================================================= */

        let currentPokemon = null;
        let isReadingMode = false;
        let pinyinFn = null;

        let pinyinLoadSource = 'NOT_LOADED';
        let isChangingQuestion = false;
        let pendingMicStart = false;

        const SCORE_CORRECT = 90;
        const SCORE_CLOSE = 75;
        const INTERIM_RESCUE_MIN_FINAL_SCORE = 75;
        const WAIT_FOR_SPEECH_MS = 7000;
        const SPEECH_END_GRACE_MS = 1500;
        const AUDIO_STOP_WATCHDOG_MS = 2500;
        const RESULT_WAIT_AFTER_AUDIO_MS = 1600;
        const END_RESULT_GRACE_MS = 400;
        const FAST_FINAL_CONFIRM_MS = 250;
        const FINAL_BELOW_THRESHOLD_SETTLE_MS = 900;
        const HARD_SESSION_LIMIT_MS = 26000;
        const ABORT_SETTLE_MS = 900;
        const MAX_ALTERNATIVES = 5;
        const MAX_UTTERANCE_CANDIDATES = 15;

        const SILENT_NAME_SYMBOLS = new Set([
            '：', ':', '・', '．', '.', '·', '•', '‧'
        ]);

        let questionBag = [];
        let lastPokemon = null;

        const card = document.getElementById('pokemonCard');
        const pokemonImage = document.getElementById('pokemonImage');
        const bopomofoText = document.getElementById('bopomofoText');
        const statusMessage = document.getElementById('statusMessage');
        const micBtn = document.getElementById('micBtn');
        const showBtn = document.getElementById('showBtn');
        const nextBtn = document.getElementById('nextBtn');
        const modeBtn = document.getElementById('modeBtn');

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let activeSession = null;
        let sessionSerial = 0;

        function setStatus(message, type = '') {
            statusMessage.textContent = message;
            statusMessage.className = type;
        }

        function setMicBusy(isBusy, text = '') {
            micBtn.disabled = isBusy;
            micBtn.textContent = text || (isBusy ? '⏹️ 錄音中...' : '🎤 按下說話');
            micBtn.style.backgroundColor = isBusy ? '#f44336' : '#4CAF50';
            micBtn.setAttribute('aria-pressed', isBusy ? 'true' : 'false');
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function isSilentNameSymbol(char) {
            return SILENT_NAME_SYMBOLS.has(String(char || ''));
        }

        function isRealZhuyin(value) {
            return /[ㄅ-ㄩ]/.test(normalizeZhuyinSyllable(value));
        }

        function getPronounceableSyllableCount(pokemon) {
            return getTargetZhuyin(pokemon).length;
        }

        function getSpeechRecordingLimitMs(pokemon) {
            const count = getPronounceableSyllableCount(pokemon);
            if (count <= 2) return 5000;
            if (count === 3) return 6000;
            if (count === 4) return 7000;
            return 8000;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function refillQuestionBag() {
            questionBag = shuffleArray([...pokemonDB]);
            if (
                lastPokemon &&
                questionBag.length > 1 &&
                questionBag[questionBag.length - 1] === lastPokemon
            ) {
                [questionBag[0], questionBag[questionBag.length - 1]] =
                    [questionBag[questionBag.length - 1], questionBag[0]];
            }
        }

        function drawNextPokemon() {
            if (!questionBag.length) {
                refillQuestionBag();
            }
            const pokemon = questionBag.pop();
            lastPokemon = pokemon;
            return pokemon;
        }

        function preloadUpcomingImage() {
            if (!questionBag.length) return;
            const nextPokemon = questionBag[questionBag.length - 1];
            if (!nextPokemon || !nextPokemon.image) return;
            const img = new Image();
            img.src = nextPokemon.image;
        }

        function validateDataset() {
            if (!Array.isArray(pokemonDB)) return;
            const issues = [];
            const names = new Set();

            pokemonDB.forEach((pokemon, index) => {
                const position = index + 1;
                const chars = Array.from(String(pokemon && pokemon.name || ''));
                const zhuyin = pokemon && Array.isArray(pokemon.zhuyin) ? pokemon.zhuyin : [];

                if (!pokemon || !pokemon.name) {
                    issues.push(`#${position} 缺少 name`);
                    return;
                }
                if (!Array.isArray(pokemon.zhuyin)) {
                    issues.push(`${pokemon.name}：zhuyin 不是陣列`);
                } else if (chars.length !== zhuyin.length) {
                    issues.push(`${pokemon.name}：名稱 ${chars.length} 個字元，但 zhuyin 有 ${zhuyin.length} 個項目`);
                }
                if (!pokemon.image) {
                    issues.push(`${pokemon.name}：缺少 image`);
                }
                if (names.has(pokemon.name)) {
                    issues.push(`${pokemon.name}：名稱重複`);
                }
                names.add(pokemon.name);
            });

            if (issues.length) {
                console.warn(`發現 ${issues.length} 個結構問題：`);
                issues.forEach(item => console.warn(item));
            }
        }

        function registerPinyinFromGlobal(sourceLabel) {
            if (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function') {
                pinyinFn = window.pinyinPro.pinyin;
                pinyinLoadSource = sourceLabel;
                return true;
            }
            return false;
        }

        function loadPinyinClassicScript(url, sourceLabel, timeoutMs = 6000) {
            return new Promise((resolve, reject) => {
                if (registerPinyinFromGlobal('already-present')) {
                    resolve(true);
                    return;
                }

                const script = document.createElement('script');
                let settled = false;

                const finish = (ok, error) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    script.onload = null;
                    script.onerror = null;
                    if (ok) resolve(true);
                    else reject(error || new Error(`${sourceLabel} failed`));
                };

                const timer = setTimeout(() => {
                    finish(false, new Error(`${sourceLabel} timeout after ${timeoutMs}ms`));
                }, timeoutMs);

                script.async = true;
                script.src = url;
                script.crossOrigin = 'anonymous';

                script.onload = () => {
                    if (registerPinyinFromGlobal(sourceLabel)) {
                        finish(true);
                    } else {
                        finish(false, new Error(`${sourceLabel} loaded but window.pinyinPro.pinyin is missing`));
                    }
                };

                script.onerror = () => {
                    finish(false, new Error(`${sourceLabel} script error`));
                };

                document.head.appendChild(script);
            });
        }

        async function ensurePinyinProLoaded() {
            if (registerPinyinFromGlobal('preloaded')) return true;

            const classicSources = [
                {
                    label: 'jsDelivr index.js',
                    url: 'https://cdn.jsdelivr.net/npm/pinyin-pro@3.28.1/dist/index.js'
                },
                {
                    label: 'unpkg index.js',
                    url: 'https://unpkg.com/pinyin-pro@3.28.1/dist/index.js'
                },
                {
                    label: 'cdnjs index.js',
                    url: 'https://cdnjs.cloudflare.com/ajax/libs/pinyin-pro/3.28.1/index.js'
                }
            ];

            for (const source of classicSources) {
                try {
                    await loadPinyinClassicScript(source.url, source.label);
                    if (pinyinFn) return true;
                } catch (error) {
                    console.warn(`[pinyin-pro] ${source.label} 載入失敗：`, error);
                }
            }

            try {
                const esmUrl = 'https://cdn.jsdelivr.net/npm/pinyin-pro@3.28.1/dist/index.mjs';
                const module = await import(esmUrl);
                if (module && typeof module.pinyin === 'function') {
                    pinyinFn = module.pinyin;
                    pinyinLoadSource = 'jsDelivr ESM';
                    return true;
                }
            } catch (error) {
                console.warn('[pinyin-pro] ESM fallback 載入失敗：', error);
            }

        function generateZhuyinHTML(name, zhuyinArray) {
            let html = '';
            const chars = Array.from(String(name || ''));

            for (let i = 0; i < chars.length; i++) {
                const char = chars[i];
                const bpmf = zhuyinArray[i] || '';

                if (isSilentNameSymbol(char)) {
                    html += `
                        <div class="char-block symbol-only" aria-hidden="true">
                            <div class="char-text">${escapeHtml(char)}</div>
                        </div>
                    `;
                    continue;
                }

                if (!isRealZhuyin(bpmf)) {
                    html += `
                        <div class="char-block symbol-only">
                            <div class="char-text">${escapeHtml(char)}</div>
                        </div>
                    `;
                    continue;
                }

                let tone = '';
                let lightTone = '';
                let mainBpmf = bpmf;

                if (bpmf.startsWith('˙')) {
                    lightTone = '˙';
                    mainBpmf = bpmf.substring(1);
                } else if (bpmf.endsWith('˙')) {
                    lightTone = '˙';
                    mainBpmf = bpmf.slice(0, -1);
                } else if (['ˊ', 'ˇ', 'ˋ'].includes(bpmf.slice(-1))) {
                    tone = bpmf.slice(-1);
                    mainBpmf = bpmf.slice(0, -1);
                }

                const bpmfSpans = mainBpmf
                    .split('')
                    .map(b => `<span>${escapeHtml(b)}</span>`)
                    .join('');

                html += `
                    <div class="char-block">
                        <div class="char-text">${escapeHtml(char)}</div>
                        <div class="zhuyin-col">
                            ${lightTone ? `<div class="tone-light">${lightTone}</div>` : ''}
                            <div class="bpmf-stack">${bpmfSpans}</div>
                            ${tone ? `<div class="tone-side">${tone}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function normalizeZhuyinSyllable(value) {

        function getTargetZhuyin(pokemon) {

            return pokemon.zhuyin
                .map((value, index) => {

        function pinyinSyllableToZhuyin(rawSyllable) {
            let syllable = String(rawSyllable || '')
                .toLowerCase()
                .replace(/u:/g, 'v')
                .replace(/ü/g, 'v')
                .replace(/[^a-zv]/g, '');

            if (!syllable) return '';

            const zeroInitialMap = {
                yi: 'ㄧ', ya: 'ㄧㄚ', yo: 'ㄧㄛ', ye: 'ㄧㄝ', yai: 'ㄧㄞ',
                yao: 'ㄧㄠ', you: 'ㄧㄡ', yan: 'ㄧㄢ', yin: 'ㄧㄣ', yang: 'ㄧㄤ',
                ying: 'ㄧㄥ', yong: 'ㄩㄥ', yu: 'ㄩ', yue: 'ㄩㄝ', yuan: 'ㄩㄢ',
                yun: 'ㄩㄣ', wu: 'ㄨ', wa: 'ㄨㄚ', wo: 'ㄨㄛ', wai: 'ㄨㄞ',
                wei: 'ㄨㄟ', wan: 'ㄨㄢ', wen: 'ㄨㄣ', wang: 'ㄨㄤ', weng: 'ㄨㄥ'
            };

            if (zeroInitialMap[syllable]) return zeroInitialMap[syllable];

            const initialMap = {
                zh: 'ㄓ', ch: 'ㄔ', sh: 'ㄕ',
                b: 'ㄅ', p: 'ㄆ', m: 'ㄇ', f: 'ㄈ',
                d: 'ㄉ', t: 'ㄊ', n: 'ㄋ', l: 'ㄌ',
                g: 'ㄍ', k: 'ㄎ', h: 'ㄏ',
                j: 'ㄐ', q: 'ㄑ', x: 'ㄒ',
                r: 'ㄖ', z: 'ㄗ', c: 'ㄘ', s: 'ㄙ'
            };

            const finalMap = {
                a: 'ㄚ', o: 'ㄛ', e: 'ㄜ', ai: 'ㄞ', ei: 'ㄟ', ao: 'ㄠ', ou: 'ㄡ',
                an: 'ㄢ', en: 'ㄣ', ang: 'ㄤ', eng: 'ㄥ', er: 'ㄦ',
                i: 'ㄧ', ia: 'ㄧㄚ', ie: 'ㄧㄝ', iao: 'ㄧㄠ', iu: 'ㄧㄡ', iou: 'ㄧㄡ',
                ian: 'ㄧㄢ', in: 'ㄧㄣ', iang: 'ㄧㄤ', ing: 'ㄧㄥ', iong: 'ㄩㄥ',
                u: 'ㄨ', ua: 'ㄨㄚ', uo: 'ㄨㄛ', uai: 'ㄨㄞ', ui: 'ㄨㄟ', uei: 'ㄨㄟ',
                uan: 'ㄨㄢ', un: 'ㄨㄣ', uen: 'ㄨㄣ', uang: 'ㄨㄤ', ong: 'ㄨㄥ', ueng: 'ㄨㄥ',
                v: 'ㄩ', ve: 'ㄩㄝ', van: 'ㄩㄢ', vn: 'ㄩㄣ'
            };

            let initial = '';
            let rest = syllable;

            for (const candidate of ['zh', 'ch', 'sh']) {
                if (syllable.startsWith(candidate)) {
                    initial = candidate;
                    rest = syllable.slice(candidate.length);
                    break;
                }
            }

            if (!initial && initialMap[syllable[0]]) {
                initial = syllable[0];
                rest = syllable.slice(1);
            }

            if (rest === 'i' && ['zh', 'ch', 'sh', 'r', 'z', 'c', 's'].includes(initial)) {
                return initialMap[initial] || '';
            }

            if (['j', 'q', 'x'].includes(initial)) {
                if (rest === 'u') rest = 'v';
                else if (rest === 'ue') rest = 've';
                else if (rest === 'uan') rest = 'van';
                else if (rest === 'un') rest = 'vn';
            }

            const initialZhuyin = initialMap[initial] || '';
            const finalZhuyin = finalMap[rest] || '';

            if (!initial && finalZhuyin) return finalZhuyin;
            if (initialZhuyin && (finalZhuyin || rest === '')) return initialZhuyin + finalZhuyin;
            return '';
        }

        function normalizeNameForComparison(text) {
            return String(text || '')
                .normalize('NFKC')
                .replace(/[：:・．.·•‧\s]/g, '')
                .replace(/[^\u3400-\u9fffA-Za-z0-9üÜ]/g, '')
                .toLowerCase()
                .trim();
        }

        function cleanRecognizedText(text) {
            return normalizeNameForComparison(text);
        }

        function recognizedTextToZhuyin(text) {
            if (!pinyinFn || !text) return [];
            try {
                const pinyinArray = pinyinFn(text, {
                    toneType: 'none',
                    type: 'array',
                    nonZh: 'removed'
                });
                return pinyinArray.map(item => pinyinSyllableToZhuyin(item)).filter(Boolean);
            } catch (error) {
                console.warn('辨識文字轉注音失敗：', error);
                return [];
            }
        }

        function levenshteinDistance(a, b) {
            a = String(a || '');
            b = String(b || '');
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;

            const previous = new Array(b.length + 1);
            const current = new Array(b.length + 1);
            for (let j = 0; j <= b.length; j++) previous[j] = j;

            for (let i = 1; i <= a.length; i++) {
                current[0] = i;
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    current[j] = Math.min(current[j - 1] + 1, previous[j] + 1, previous[j - 1] + cost);
                }
                for (let j = 0; j <= b.length; j++) previous[j] = current[j];
            }
            return previous[b.length];
        }

        function stringSimilarity(a, b) {
            a = String(a || '');
            b = String(b || '');
            if (!a && !b) return 100;
            if (!a || !b) return 0;
            if (a === b) return 100;
            const maxLength = Math.max(a.length, b.length);
            const distance = levenshteinDistance(a, b);
            return Math.max(0, (1 - distance / maxLength) * 100);
        }

        const ZHUYIN_INITIALS = new Set([
            'ㄅ', 'ㄆ', 'ㄇ', 'ㄈ', 'ㄉ', 'ㄊ', 'ㄋ', 'ㄌ',
            'ㄍ', 'ㄎ', 'ㄏ', 'ㄐ', 'ㄑ', 'ㄒ', 'ㄓ', 'ㄔ',
            'ㄕ', 'ㄖ', 'ㄗ', 'ㄘ', 'ㄙ'
        ]);

        const CLOSE_INITIAL_GROUPS = [
            new Set(['ㄓ', 'ㄗ']), new Set(['ㄔ', 'ㄘ']), new Set(['ㄕ', 'ㄙ']),
            new Set(['ㄋ', 'ㄌ']), new Set(['ㄌ', 'ㄖ']), new Set(['ㄐ', 'ㄑ']),
            new Set(['ㄑ', 'ㄒ'])
        ];

        const CLOSE_FINAL_GROUPS = [
            new Set(['ㄣ', 'ㄥ']), new Set(['ㄢ', 'ㄤ']), new Set(['ㄧㄣ', 'ㄧㄥ'])
        ];

        function splitZhuyinSyllable(value) {
            const syllable = normalizeZhuyinSyllable(value);
            if (!syllable) return { initial: '', final: '' };
            const first = syllable[0];
            if (ZHUYIN_INITIALS.has(first)) {
                return { initial: first, final: syllable.slice(1) };
            }
            return { initial: '', final: syllable };
        }

        function inSameCloseGroup(a, b, groups) {
            if (!a || !b || a === b) return false;
            return groups.some(group => group.has(a) && group.has(b));
        }

        function isConservativeCloseSyllable(a, b) {
            a = normalizeZhuyinSyllable(a);
            b = normalizeZhuyinSyllable(b);
            if (!a || !b || a === b) return false;

            const left = splitZhuyinSyllable(a);
            const right = splitZhuyinSyllable(b);

            if (left.final && left.final === right.final && inSameCloseGroup(left.initial, right.initial, CLOSE_INITIAL_GROUPS)) {
                return true;
            }
            if (left.initial === right.initial && inSameCloseGroup(left.final, right.final, CLOSE_FINAL_GROUPS)) {
                return true;
            }
            return false;
        }

        function zhuyinSequenceScore(spokenZhuyin, targetZhuyin) {
            if (!spokenZhuyin.length || !targetZhuyin.length) return 0;
            const spokenJoined = spokenZhuyin.join('');
            const targetJoined = targetZhuyin.join('');
            const wholeStringScore = stringSimilarity(spokenJoined, targetJoined);
            const maxCount = Math.max(spokenZhuyin.length, targetZhuyin.length);

            let syllableTotal = 0;
            for (let i = 0; i < maxCount; i++) {
                syllableTotal += stringSimilarity(spokenZhuyin[i] || '', targetZhuyin[i] || '');
            }
            const syllableScore = syllableTotal / maxCount;
            return Math.round(syllableScore * 0.7 + wholeStringScore * 0.3);
        }

        function analyzeConservativePhoneticRescue(bestWindow, targetZhuyin) {
            const targetLength = targetZhuyin.length;
            if (targetLength < 3 || bestWindow.length !== targetLength) {
                return {
                    eligible: false, exactCount: 0, closeCount: 0,
                    mismatchCount: Math.max(bestWindow.length, targetLength)
                };
            }

            let exactCount = 0;
            let closeCount = 0;
            let mismatchCount = 0;

            for (let i = 0; i < targetLength; i++) {
                const spoken = normalizeZhuyinSyllable(bestWindow[i]);
                const target = normalizeZhuyinSyllable(targetZhuyin[i]);
                if (spoken === target) {
                    exactCount++;
                    continue;
                }
                mismatchCount++;
                if (isConservativeCloseSyllable(spoken, target)) closeCount++;
            }

            const eligible = mismatchCount === 1 && closeCount === 1 && exactCount === targetLength - 1;
            return { eligible, exactCount, closeCount, mismatchCount };
        }

        function getBestZhuyinScore(spokenZhuyin, targetZhuyin) {
            if (!spokenZhuyin.length || !targetZhuyin.length) return { score: 0, bestWindow: [] };
            const targetLength = targetZhuyin.length;
            let bestScore = 0;
            let bestWindow = spokenZhuyin;

            if (spokenZhuyin.length >= targetLength) {
                for (let start = 0; start <= spokenZhuyin.length - targetLength; start++) {
                    const window = spokenZhuyin.slice(start, start + targetLength);
                    const score = zhuyinSequenceScore(window, targetZhuyin);
                    if (score > bestScore) {
                        bestScore = score;
                        bestWindow = window;
                    }
                }
            } else {
                bestScore = zhuyinSequenceScore(spokenZhuyin, targetZhuyin);
            }
            return { score: Math.round(bestScore), bestWindow };
        }

        function evaluateTranscript(transcript, pokemon) {
            const cleanText = cleanRecognizedText(transcript);
            const targetZhuyin = getTargetZhuyin(pokemon);

            if (!cleanText) {

                    spokenZhuyin: [], targetZhuyin, bestWindow: [],
                    exactTextMatch: false, exactZhuyinMatch: false,
                    phoneticRescue: false, matchType: 'empty'
                };
            }

            const normalizedTargetName = normalizeNameForComparison(pokemon.name);
            if (normalizedTargetName && cleanText.includes(normalizedTargetName)) {
                return {
                    transcript, cleanText, score: 100, rawScore: 100,
                    spokenZhuyin: recognizedTextToZhuyin(cleanText),
                    targetZhuyin, bestWindow: targetZhuyin,
                    exactTextMatch: true, exactZhuyinMatch: true,
                    phoneticRescue: false, matchType: 'exact-text'

            if (!pinyinFn) {

                    transcript, cleanText, score: 0, rawScore: 0,
                    spokenZhuyin: [], targetZhuyin, bestWindow: [],
                    exactTextMatch: false, exactZhuyinMatch: false,
                    phoneticRescue: false, matchType: 'pinyin-unavailable'
                };
            }

            const spokenZhuyin = recognizedTextToZhuyin(cleanText);
            const result = getBestZhuyinScore(spokenZhuyin, targetZhuyin);

            const exactZhuyinMatch =
                result.bestWindow.length === targetZhuyin.length &&
                targetZhuyin.length > 0 &&
                result.bestWindow.every((value, index) =>
                    normalizeZhuyinSyllable(value) === normalizeZhuyinSyllable(targetZhuyin[index])

            if (exactZhuyinMatch) {

                    transcript, cleanText, score: 100, rawScore: result.score,
                    spokenZhuyin, targetZhuyin, bestWindow: result.bestWindow,
                    exactTextMatch: false, exactZhuyinMatch: true,
                    phoneticRescue: false, matchType: 'exact-zhuyin'
                };

            const rescue = analyzeConservativePhoneticRescue(result.bestWindow, targetZhuyin);
            const finalScore = rescue.eligible ? Math.max(result.score, 91) : result.score;

            return {
                transcript, cleanText, score: finalScore, rawScore: result.score,
                spokenZhuyin, targetZhuyin, bestWindow: result.bestWindow,
                exactTextMatch: false, exactZhuyinMatch: false,
                phoneticRescue: rescue.eligible, phoneticDetails: rescue,
                matchType: rescue.eligible ? 'phonetic-rescue' : 'similarity'
            };

        function isCurrentSession(session) {

        function clearSessionTimers(session) {
            if (!session) return;

                'audioStopWatchdogTimer', 'resultWaitTimer', 'endGraceTimer',
                'hardLimitTimer', 'abortSettleTimer', 'earlyDecisionTimer'
            ].forEach(key => {
                clearTimeout(session[key]);

        function normalizeCandidateKey(transcript) {
            return String(transcript || '')
                .replace(/[\s，。！？、,.!?：:；;「」『』（）()【】\[\]]+/g, '')
                .trim();

        function addCandidate(session, candidate) {
            if (!session || !candidate || !candidate.transcript) return;
            const transcript = String(candidate.transcript).trim();
            const key = normalizeCandidateKey(transcript);
            if (!key) return;

            let entry = session.candidateMap.get(key);
            if (!entry) {
                entry = {
                    transcript, sources: new Set(), seenCount: 0,
                    finalSeen: false, interimSeen: false, bestConfidence: null
                };
                session.candidateMap.set(key, entry);
            }

            entry.seenCount++;
            entry.sources.add(candidate.source || 'UNKNOWN');
            if (candidate.isFinal) entry.finalSeen = true;
            if (candidate.isInterim) entry.interimSeen = true;

            if (typeof candidate.confidence === 'number' &&
                (entry.bestConfidence === null || candidate.confidence > entry.bestConfidence)) {
                entry.bestConfidence = candidate.confidence;
            }

        function buildFullUtteranceCandidates(event) {
            if (!event || !event.results || !event.results.length) return [];

            let beams = [{ transcript: '', confidenceTotal: 0, confidenceCount: 0, rankPenalty: 0 }];
            let allFinal = true;
            let anyResult = false;

            for (let r = 0; r < event.results.length; r++) {
                const result = event.results[r];
                if (!result || !result.length) continue;
                anyResult = true;
                if (!result.isFinal) allFinal = false;

                const alternatives = [];
                for (let i = 0; i < result.length && i < MAX_ALTERNATIVES; i++) {
                    const alt = result[i];
                    const transcript = alt && alt.transcript ? alt.transcript.trim() : '';
                    if (!transcript) continue;
                    alternatives.push({
                        transcript,
                        confidence: typeof alt.confidence === 'number' ? alt.confidence : null,
                        rank: i
                    });
                }

                if (!alternatives.length) continue;
                const next = [];

                for (const beam of beams) {
                    for (const alt of alternatives) {
                        const hasConfidence = typeof alt.confidence === 'number';
                        next.push({
                            transcript: `${beam.transcript} ${alt.transcript}`.trim(),
                            confidenceTotal: beam.confidenceTotal + (hasConfidence ? alt.confidence : 0),
                            confidenceCount: beam.confidenceCount + (hasConfidence ? 1 : 0),
                            rankPenalty: beam.rankPenalty + alt.rank
                        });
                    }
                }

                next.sort((a, b) => {
                    if (a.rankPenalty !== b.rankPenalty) return a.rankPenalty - b.rankPenalty;
                    const ac = a.confidenceCount ? a.confidenceTotal / a.confidenceCount : 0;
                    const bc = b.confidenceCount ? b.confidenceTotal / b.confidenceCount : 0;
                    return bc - ac;
                });

                beams = next.slice(0, MAX_UTTERANCE_CANDIDATES);
            }

            if (!anyResult) return [];

            return beams.map(beam => ({
                transcript: beam.transcript,
                confidence: beam.confidenceCount ? beam.confidenceTotal / beam.confidenceCount : null,
                source: allFinal ? 'FULL_FINAL' : 'FULL_MIXED',
                isFinal: allFinal,
                isInterim: !allFinal
            }));
        }

        function captureRecognitionResult(session, event) {
            if (!session || session.finished || session.cancelled) return;

            if (event && event.results) {
                for (let resultIndex = 0; resultIndex < event.results.length; resultIndex++) {
                    const result = event.results[resultIndex];
                    if (!result) continue;

                    for (let i = 0; i < result.length && i < MAX_ALTERNATIVES; i++) {
                        const alt = result[i];
                        const transcript = alt && alt.transcript ? alt.transcript.trim() : '';
                        if (!transcript) continue;

                        addCandidate(session, {
                            transcript,
                            confidence: typeof alt.confidence === 'number' ? alt.confidence : null,
                            source: result.isFinal ? 'FINAL_SEGMENT' : 'INTERIM_SEGMENT',
                            isFinal: Boolean(result.isFinal),
                            isInterim: !result.isFinal
                        });
                    }
                }
            }

            buildFullUtteranceCandidates(event).forEach(candidate => addCandidate(session, candidate));
        }

        function evaluateSessionCandidates(session) {
            const rows = [];
            for (const entry of session.candidateMap.values()) {
                const evaluation = evaluateTranscript(entry.transcript, session.targetPokemon);
                rows.push({
                    ...evaluation,
                    sources: Array.from(entry.sources),
                    seenCount: entry.seenCount,
                    finalSeen: entry.finalSeen,
                    interimSeen: entry.interimSeen,
                    confidence: entry.bestConfidence
                });
            }

            rows.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                if (Number(b.exactTextMatch) !== Number(a.exactTextMatch)) return Number(b.exactTextMatch) - Number(a.exactTextMatch);
                if (Number(b.exactZhuyinMatch) !== Number(a.exactZhuyinMatch)) return Number(b.exactZhuyinMatch) - Number(a.exactZhuyinMatch);
                if (Number(b.finalSeen) !== Number(a.finalSeen)) return Number(b.finalSeen) - Number(a.finalSeen);
                if (b.seenCount !== a.seenCount) return b.seenCount - a.seenCount;
                return (b.confidence || 0) - (a.confidence || 0);
            });

            return rows;
        }

        function selectSessionEvidence(session, evaluations) {
            if (!evaluations.length) return { selected: null, reason: 'NO_CANDIDATE' };

            const exactStrong = evaluations.find(item =>
                (item.exactTextMatch || item.exactZhuyinMatch) && (item.finalSeen || item.seenCount >= 2)
            );
            if (exactStrong) {
                return {
                    selected: exactStrong,
                    reason: exactStrong.exactTextMatch ? 'EXACT_TEXT_CONFIRMED' : 'EXACT_ZHUYIN_CONFIRMED'
                };
            }

            const bestFinal = evaluations.find(item => item.finalSeen) || null;
            if (bestFinal && bestFinal.score >= SCORE_CORRECT) {
                return { selected: bestFinal, reason: 'BEST_FINAL_OVER_THRESHOLD' };
            }

            const best = evaluations[0];
            const stableHighCandidate = best.score >= SCORE_CORRECT &&
                (best.seenCount >= 2 || (bestFinal && bestFinal.score >= SCORE_CLOSE));

            if (stableHighCandidate) {
                return { selected: best, reason: 'SESSION_POOL_HIGH_CONFIDENCE' };
            }

            return {
                selected: bestFinal || best,
                reason: bestFinal ? 'BEST_FINAL_BELOW_THRESHOLD' : 'BEST_AVAILABLE_BELOW_THRESHOLD'
            };
        }

        function applyFinalDecision(session, selected, reason) {
            if (!session || session.resultHandled || session.cancelled) return false;

            session.resultHandled = true;
            session.userMessageHandled = true;
            session.resultSource = reason;

            if (!selected) {
                setStatus('⏸️ 沒有收到可判斷的語音文字，請再試一次。', 'retry');
                return true;
            }

            const success = currentPokemon === session.targetPokemon && selected.score >= SCORE_CORRECT;

            if (success) {
                setStatus(`🎉 太棒了！答案是「${session.targetPokemon.name}」！`, 'success');
                revealAnswer();
                updateAppCounters({ addStar: true });
            } else if (selected.score >= SCORE_CLOSE) {
                setStatus('😊 差一點點，再試一次！', 'close');
            } else {
                setStatus(isReadingMode ? '💪 糟糕，再試著唸一次唷！' : '💪 糟糕，再試著拼一次唷！', 'retry');
            }

            return true;
        }

        function finalizeRecognitionDecision(session, reason = 'session finalize') {
            if (!session || session.resultHandled || session.cancelled) return false;
            const evaluations = evaluateSessionCandidates(session);
            const selection = selectSessionEvidence(session, evaluations);
            return applyFinalDecision(session, selection.selected, selection.reason);
        }

        function getBestFinalEvaluation(session) {
            const evaluations = evaluateSessionCandidates(session);
            const bestFinal = evaluations.find(item => item.finalSeen) || null;
            return { evaluations, bestFinal };
        }

        function finishFastSuccess(session, reason) {
            if (!session || session.finished || session.cancelled || session.resultHandled) return false;
            const applied = finalizeRecognitionDecision(session, reason);
            if (applied) requestStop(session, reason, false);
            return applied;
        }

        function scheduleFastDecision(session, delayMs, reason, mode = 'success') {
            if (!session || session.finished || session.cancelled || session.resultHandled) return;
            clearTimeout(session.earlyDecisionTimer);

            session.earlyDecisionTimer = setTimeout(() => {
                if (session.finished || session.cancelled || session.resultHandled) return;
                const { bestFinal } = getBestFinalEvaluation(session);
                if (!bestFinal) return;

                if (mode === 'success') {
                    if (bestFinal.score >= SCORE_CORRECT) finishFastSuccess(session, reason);
                    return;
                }

                const targetLength = getTargetZhuyin(session.targetPokemon).length;
                const spokenLength = Array.isArray(bestFinal.spokenZhuyin) ? bestFinal.spokenZhuyin.length : 0;

                if (bestFinal.finalSeen && (spokenLength >= targetLength || String(bestFinal.cleanText || '').length >= targetLength)) {
                    requestStop(session, reason, true);
                }
            }, delayMs);
        }

        function considerFastDecision(session) {
            if (!session || session.finished || session.cancelled || session.resultHandled || session.stopRequested) return;
            const { bestFinal } = getBestFinalEvaluation(session);
            if (!bestFinal) return;

            if (bestFinal.exactTextMatch || bestFinal.exactZhuyinMatch) {
                clearTimeout(session.earlyDecisionTimer);
                finishFastSuccess(session, bestFinal.exactTextMatch ? 'fast exact-text final' : 'fast exact-zhuyin final');
                return;
            }

            if (bestFinal.score >= SCORE_CORRECT) {
                scheduleFastDecision(session, FAST_FINAL_CONFIRM_MS, 'fast high-score final', 'success');
                return;
            }

            const targetLength = getTargetZhuyin(session.targetPokemon).length;
            const spokenLength = Array.isArray(bestFinal.spokenZhuyin) ? bestFinal.spokenZhuyin.length : 0;

            if (spokenLength >= targetLength || String(bestFinal.cleanText || '').length >= targetLength) {
                scheduleFastDecision(session, FINAL_BELOW_THRESHOLD_SETTLE_MS, 'complete final settled below threshold', 'stop-only');
            }
        }

        function finishSession(session, options = {}) {
            if (!session || session.finished) return;
            session.finished = true;
            clearSessionTimers(session);

            if (isCurrentSession(session)) {
                activeSession = null;
                setMicBusy(false);
            }

            if (!session.cancelled && !session.resultHandled && !session.userMessageHandled && !options.keepStatus) {
                setStatus('⏸️ 沒有收到可用的語音辨識結果，再試一次唷！', 'retry');
            }

            session.recognition = null;
        }

        function forceAbortSession(session, reason = 'watchdog') {
            if (!session || session.finished || !session.recognition) return;
            if (!session.abortRequested) {
                session.abortRequested = true;
                try { session.recognition.abort(); } catch (error) {}
            }

            clearTimeout(session.abortSettleTimer);
            session.abortSettleTimer = setTimeout(() => {
                if (!session.finished) {
                    if (!session.cancelled && !session.resultHandled) {
                        finalizeRecognitionDecision(session, `abort settle: ${reason}`);
                    }
                    finishSession(session, { keepStatus: true });
                }
            }, ABORT_SETTLE_MS);
        }

        function startHardSessionWatchdog(session) {
            clearTimeout(session.hardLimitTimer);
            session.hardLimitTimer = setTimeout(() => {
                if (session.finished) return;
                if (!session.resultHandled && !session.cancelled) {
                    finalizeRecognitionDecision(session, 'hard session limit');
                }
                forceAbortSession(session, 'hard session limit');
            }, HARD_SESSION_LIMIT_MS);
        }

        function startAudioStopWatchdog(session) {
            clearTimeout(session.audioStopWatchdogTimer);
            session.audioStopWatchdogTimer = setTimeout(() => {
                if (session.finished || session.audioEnded || session.serviceEnded) return;
                if (!session.resultHandled && !session.cancelled) {
                    finalizeRecognitionDecision(session, 'audio stop watchdog');
                }
                forceAbortSession(session, 'audio stop watchdog');
            }, AUDIO_STOP_WATCHDOG_MS);
        }

        function requestStop(session, reason = 'timer', updateMessage = true) {
            if (!session || session.finished || session.serviceEnded || !session.recognition || session.stopRequested) return;

            session.stopRequested = true;
            session.stopReason = reason;
            clearTimeout(session.preSpeechTimer);
            clearTimeout(session.recordingTimer);
            clearTimeout(session.speechEndTimer);

            if (updateMessage && !session.cancelled) {
                setStatus('⏳ 已收到完整答案，正在做最後確認...');
                setMicBusy(true, '⏳ 判斷中...');
            }

            try {
                session.recognition.stop();
            } catch (error) {
                finalizeRecognitionDecision(session, 'stop() threw');
                forceAbortSession(session, 'stop() threw');
                return;
            }

            startAudioStopWatchdog(session);
        }

        function cancelActiveRecognition(reason = 'cancel', silent = false) {
            const session = activeSession;
            if (!session || session.finished) return;
            session.cancelled = true;
            session.userMessageHandled = true;
            session.stopReason = reason;
            forceAbortSession(session, reason);
            if (!silent) setStatus('⏸️ 錄音已取消。', 'retry');
        }

        function scheduleResultWaitAfterAudioEnd(session) {
            clearTimeout(session.resultWaitTimer);
            session.resultWaitTimer = setTimeout(() => {
                if (session.finished || session.resultHandled || session.cancelled) return;
                finalizeRecognitionDecision(session, 'audioend result settle timeout');
                forceAbortSession(session, 'result settle complete');
            }, RESULT_WAIT_AFTER_AUDIO_MS);
        }

        function createRecognitionSession() {
            if (!SpeechRecognition || !currentPokemon) return null;

            const recognition = new SpeechRecognition();
            const session = {
                id: ++sessionSerial,
                recognition,
                createdAt: performance.now(),
                targetPokemon: currentPokemon,
                started: false, audioStarted: false, audioEnded: false,
                speechStarted: false, speechEnded: false, serviceEnded: false,
                stopRequested: false, stopReason: '', abortRequested: false,
                resultHandled: false, finalResultHandled: false, userMessageHandled: false,
                cancelled: false, finished: false, resultSource: '',
                candidateMap: new Map(),
                recordingLimitMs: getSpeechRecordingLimitMs(currentPokemon),
                preSpeechTimer: null, recordingTimer: null, speechEndTimer: null,
                audioStopWatchdogTimer: null, resultWaitTimer: null, endGraceTimer: null,
                hardLimitTimer: null, abortSettleTimer: null, earlyDecisionTimer: null
            };

            recognition.lang = 'zh-TW';
            recognition.interimResults = true;
            recognition.maxAlternatives = MAX_ALTERNATIVES;
            recognition.continuous = true;

            recognition.onstart = () => {
                if (!isCurrentSession(session) || session.cancelled) return;
                session.started = true;
                setStatus('👂 麥克風已開啟，請正常把完整答案說完');
                setMicBusy(true, '⏹️ 錄音中...');

                clearTimeout(session.preSpeechTimer);
                session.preSpeechTimer = setTimeout(() => {
                    if (!session.speechStarted && !session.finished) {
                        session.userMessageHandled = true;
                        setStatus('👂 還沒有聽到說話聲，再試一次唷！', 'retry');
                        requestStop(session, '等待說話逾時', false);
                    }
                }, WAIT_FOR_SPEECH_MS);

                startHardSessionWatchdog(session);
            };

            recognition.onaudiostart = () => { session.audioStarted = true; };
            recognition.onsoundstart = () => { clearTimeout(session.speechEndTimer); };
            recognition.onsoundend = () => {};

            recognition.onspeechstart = () => {
                const firstSpeechStart = !session.speechStarted;
                session.speechStarted = true;
                session.speechEnded = false;
                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.speechEndTimer);

                if (firstSpeechStart) {
                    clearTimeout(session.recordingTimer);
                    session.recordingTimer = setTimeout(() => {
                        requestStop(session, `speechstart 後 ${session.recordingLimitMs}ms 最大收音窗`, true);
                    }, session.recordingLimitMs);
                }

                if (isCurrentSession(session) && !session.cancelled) {
                    setStatus('🎙️ 正在收音，請把完整答案說完');
                }
            };

            recognition.onspeechend = () => {
                session.speechEnded = true;
                if (isCurrentSession(session) && !session.cancelled) {
                    setStatus(`⏳ 偵測到停頓，保留 ${SPEECH_END_GRACE_MS / 1000} 秒等待後續語音...`);
                }

                clearTimeout(session.speechEndTimer);
                session.speechEndTimer = setTimeout(() => {
                    if (!session.finished && !session.cancelled && !session.stopRequested) {
                        requestStop(session, 'speechend 後靜音窗結束', true);
                    }
                }, SPEECH_END_GRACE_MS);
            };

            recognition.onaudioend = () => {
                session.audioEnded = true;
                clearTimeout(session.audioStopWatchdogTimer);
                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.recordingTimer);
                clearTimeout(session.speechEndTimer);

                if (!session.resultHandled && !session.cancelled) {
                    setStatus('⏳ 收音完成，正在做最後確認...');
                    scheduleResultWaitAfterAudioEnd(session);
                }
            };

            recognition.onresult = event => {
                clearTimeout(session.earlyDecisionTimer);
                captureRecognitionResult(session, event);
                if (!isCurrentSession(session) || session.cancelled) return;
                considerFastDecision(session);

                if (!session.resultHandled && !session.stopRequested) {
                    setStatus('🎙️ 已收到辨識結果，正在確認是否可以立即判斷...');
                }
            };

            recognition.onnomatch = () => {
                if (!isCurrentSession(session) || session.cancelled) return;
                requestStop(session, 'nomatch', true);
            };

            recognition.onerror = event => {
                const errorName = event && event.error ? event.error : 'unknown';
                console.warn('[SpeechRecognition error]', errorName);

                if (!isCurrentSession(session) || session.cancelled) return;
                if (errorName === 'aborted' && session.abortRequested) return;

                if (errorName === 'not-allowed' || errorName === 'service-not-allowed') {
                    session.userMessageHandled = true;
                    setStatus('🎤 請允許瀏覽器使用麥克風後再試一次。', 'error');
                } else if (errorName === 'audio-capture') {
                    session.userMessageHandled = true;
                    setStatus('🎤 找不到可用的麥克風，請檢查裝置設定。', 'error');
                } else if (errorName === 'network') {
                    session.userMessageHandled = true;
                    setStatus('🌐 語音服務連線失敗，請檢查網路後再試一次。', 'error');
                }

                if (!session.resultHandled && session.candidateMap.size) {
                    finalizeRecognitionDecision(session, `error: ${errorName}`);
                }

                if (errorName !== 'aborted') {
                    forceAbortSession(session, `error: ${errorName}`);
                }
            };

            recognition.onend = () => {
                session.serviceEnded = true;
                clearTimeout(session.audioStopWatchdogTimer);
                clearTimeout(session.resultWaitTimer);
                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.recordingTimer);
                clearTimeout(session.speechEndTimer);

                if (!isCurrentSession(session)) {
                    clearSessionTimers(session);
                    return;
                }

                if (session.cancelled) {
                    finishSession(session, { keepStatus: true });
                    return;
                }

                clearTimeout(session.endGraceTimer);
                session.endGraceTimer = setTimeout(() => {
                    if (session.finished) return;
                    if (!session.resultHandled) {
                        finalizeRecognitionDecision(session, 'recognition onend settle');
                    }
                    finishSession(session, { keepStatus: true });
                }, END_RESULT_GRACE_MS);
            };

            return session;
        }

        function startRecognition() {
            if (!SpeechRecognition || !currentPokemon) return;

            if (typeof pinyinFn !== 'function') {
                setStatus('❌ 注音判分模組目前不可用，已停止本次錄音，避免誤判。', 'error');
                micBtn.disabled = true;
                micBtn.textContent = '⚠️ 判分模組未載入';
                return;
            }

            if (activeSession && !activeSession.finished) return;

            const session = createRecognitionSession();
            if (!session) return;

            activeSession = session;
            setStatus('🎤 麥克風準備中...');
            setMicBusy(true, '🎤 準備中...');

            try {
                session.recognition.start();
            } catch (error) {
                console.warn('[SpeechRecognition start failed]', error);
                session.userMessageHandled = true;
                setStatus('🎤 麥克風還沒準備好，請再按一次。', 'retry');
                finishSession(session, { keepStatus: true });
            }
        }

        modeBtn.addEventListener('click', () => {
            if (isChangingQuestion) return;
            pendingMicStart = false;
            isReadingMode = !isReadingMode;
            modeBtn.textContent = isReadingMode ? '切換為：拼音模式' : '切換為：認字模式';
            loadRandomPokemon();
        });

        micBtn.addEventListener('click', () => {
            if (isChangingQuestion) {
                pendingMicStart = true;
                setStatus('⏳ 正在換題，完成後會自動開啟麥克風...');
                return;
            }
            startRecognition();
        });

        showBtn.addEventListener('click', () => {
            if (isChangingQuestion || !currentPokemon) return;
            pendingMicStart = false;
            cancelActiveRecognition('查看答案', true);
            revealAnswer();
            setStatus(`答案是：${currentPokemon.name}`);
        });

        nextBtn.addEventListener('click', () => {
            if (isChangingQuestion) return;
            pendingMicStart = false;
            loadRandomPokemon();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && activeSession && !activeSession.finished) {
                activeSession.cancelled = true;
                activeSession.userMessageHandled = true;
                forceAbortSession(activeSession, 'visibilitychange');
            }
        });

        window.addEventListener('pagehide', () => {
            if (activeSession && !activeSession.finished) {
                activeSession.cancelled = true;
                activeSession.userMessageHandled = true;
                forceAbortSession(activeSession, 'pagehide');
            }
        });
    </script>
</body>
