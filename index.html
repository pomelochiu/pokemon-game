<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="寶可夢挑戰">
    <meta name="theme-color" content="#f4f6fb">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>寶可夢拼音/認字挑戰 V17</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 鎖定單一畫面，像原生 App 一樣不捲動 */
            overscroll-behavior: none;
            background: linear-gradient(180deg, #eef3fc 0%, #f8f9fc 100%);
            font-family: "Microsoft JhengHei", "PingFang TC", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
            padding-right: max(14px, env(safe-area-inset-right));
        }

        /* App 主容器：一屏到底均分上、中、下三區 */
        .game-shell {
            width: min(100%, 760px);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* 頂部 App 狀態列（星星計分 + 題號 + 模式切換） */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            padding: 4px 2px;
        }

        .app-badges {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-pill {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: clamp(15px, 2vw, 18px);
            font-weight: 800;
            color: #334155;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .badge-pill.star {
            border-color: #fde047;
            background: #fefce8;
            color: #854d0e;
        }

        #modeBtn {
            font-size: clamp(15px, 2vw, 18px);
            padding: 8px 16px;
            min-height: 44px;
            background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(156, 39, 176, 0.25);
            font-weight: bold;
            touch-action: manipulation;
            white-space: nowrap;
            transition: transform 0.12s ease;
        }

        #modeBtn:active {
            transform: scale(0.95);
        }

        /* 中央遊戲主舞台：自動適應剩餘高度 */
        .stage-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0; /* 允許在較矮螢幕自動微縮 */
            gap: clamp(10px, 2vh, 20px);
            padding: 6px 0;
        }

        .card-container {
            perspective: 1000px;
            height: min(38vh, 330px);
            max-width: 72vw;
            aspect-ratio: 7 / 10;
            flex-shrink: 1;
        }

        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
            background-color: white;
            border: 6px solid #ffcc00;
            overflow: hidden;
        }

        .card-back {
            background: radial-gradient(circle, #2b67ad 0%, #102d57 100%);
        }

        .pokeball {
            width: clamp(88px, 13vh, 135px);
            height: clamp(88px, 13vh, 135px);
            border-radius: 50%;
            background: linear-gradient(to bottom, #d22630 46%, #000000 46%, #000000 54%, #ffffff 54%);
            border: 6px solid #000000;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .pokeball::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28%;
            height: 28%;
            background: #ffffff;
            border-radius: 50%;
            border: 5px solid #000000;
        }

        .pokeball::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 11%;
            height: 11%;
            background: #ffffff;
            border-radius: 50%;
            border: 1px solid #dddddd;
        }

        .card-front {
            transform: rotateY(180deg);
        }

        .card-front img {
            width: 112%;
            height: 112%;
            max-width: none;
            max-height: none;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 題目字卡區（App 卡片式白底圓角框） */
        .word-card {
            width: 100%;
            background: #ffffff;
            border-radius: 22px;
            padding: clamp(10px, 1.8vh, 18px) 16px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(226, 232, 240, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .bopomofo-display {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(12px, 3vw, 26px);
            min-height: clamp(82px, 12vh, 114px);
            flex-wrap: wrap;
        }

        .char-block {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .char-block.symbol-only {
            justify-content: center;
        }

        .char-block.symbol-only .char-text {
            font-size: clamp(34px, 5vw, 54px);
            font-weight: 700;
        }

        .char-text {
            font-size: clamp(40px, 5.8vw, 64px);
            font-weight: bold;
            color: #1e293b;
            line-height: 1.1;
        }

        .zhuyin-col {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: 4px;
            font-size: clamp(19px, 2.5vw, 28px);
            color: #475569;
            line-height: 1.1;
            font-weight: bold;
        }

        .hide-zhuyin .zhuyin-col {
            visibility: hidden;
        }

        .bpmf-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tone-side {
            position: absolute;
            right: -0.7em;
            top: 60%;
            transform: translateY(-50%);
        }

        .tone-light {
            position: absolute;
            top: -0.8em;
            left: 50%;
            transform: translateX(-50%);
        }

        #statusMessage {
            width: 100%;
            font-size: clamp(17px, 2.4vw, 22px);
            color: #475569;
            min-height: 32px;
            margin-top: 6px;
            font-weight: bold;
            text-align: center;
            line-height: 1.35;
        }

        #statusMessage.success { color: #16a34a; }
        #statusMessage.close { color: #ea580c; }
        #statusMessage.retry { color: #475569; }
        #statusMessage.error { color: #dc2626; }

        /* 底部固定 App 操作列 */
        .controls {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* 麥克風主按鈕佔滿整排上方，方便單手或雙手拇指點擊 */
        #micBtn {
            grid-column: 1 / -1;
            font-size: clamp(21px, 3vw, 26px);
            min-height: 62px;
            border-radius: 18px;
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
        }

        button.action-btn {
            font-size: clamp(18px, 2.5vw, 22px);
            padding: 12px 18px;
            min-height: 54px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            touch-action: manipulation;
            white-space: nowrap;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        button.action-btn:active { transform: scale(0.97); }
        button.action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        button.action-btn.secondary {
            background: linear-gradient(135deg, #2196F3 0%, #1976d2 100%);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.25);
        }
        button.action-btn.outline {
            background-color: #ffffff;
            color: #475569;
            border: 2px solid #cbd5e1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        /* 平板 / 寬螢幕：三顆按鈕並排 */
        @media (min-width: 601px) {
            .controls {
                grid-template-columns: 2fr 1fr 1fr;
                gap: 14px;
            }
            #micBtn {
                grid-column: auto;
                min-height: 60px;
            }
            button.action-btn {
                min-height: 60px;
            }
        }

        /* 平板橫向模式特別優化 */
        @media (min-width: 768px) and (max-height: 850px) and (orientation: landscape) {
            .stage-area {
                flex-direction: row;
                justify-content: center;
                gap: 28px;
            }
            .card-container {
                height: min(56vh, 320px);
            }
            .word-card {
                width: auto;
                min-width: 320px;
                max-width: 440px;
                padding: 20px 24px;
            }
        }

        /* 答對慶祝紙花畫布 */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        /* V17: use one viewport, additive safe-area padding and three layout rows. */
        html { height: 100%; overflow: auto; }
        body {
            height: 100%; height: 100dvh; min-height: 0;
            overflow: auto; align-items: stretch;
            padding: calc(env(safe-area-inset-top, 0px) + 12px)
                     calc(env(safe-area-inset-right, 0px) + 14px)
                     calc(env(safe-area-inset-bottom, 0px) + 12px)
                     calc(env(safe-area-inset-left, 0px) + 14px);
        }
        .game-shell { display: grid; grid-template-columns: minmax(0,1fr); justify-content: stretch; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; height: 100%; min-height: 0; align-items: stretch; }
        .header-bar { gap: 6px; padding: 2px 0; }
        .app-badges { gap: 6px; min-width: 0; }
        .badge-pill { padding: 7px 10px; font-size: clamp(13px, 3.5vw, 18px); }
        .badge-pill.star { font-family: inherit; min-height: 36px; touch-action: manipulation; }
        .star-svg { width: 19px; height: 19px; flex: none; display: block; }
        #modeBtn { padding: 7px 11px; font-size: clamp(13px, 3.5vw, 18px); white-space: normal; line-height: 1.3; }
        .stage-area { display: grid; grid-template-columns: minmax(0, 1fr); justify-content: stretch; grid-template-rows: minmax(0, 1fr) auto; gap: 14px; padding: 4px 0 8px; align-items: center; justify-items: center; }
        .card-slot { width: 100%; height: 100%; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr); place-items: center; padding: 8px 0; }
        .card-container { height: 100%; max-height: 380px; width: auto; aspect-ratio: 7 / 10; max-width: 76vw; min-height: 0; }
        .card:not(.is-animating) { transform: none; transform-style: flat; transition: none; }
        .card:not(.is-animating) .card-front { transform: none; display: none; }
        .card.flipped:not(.is-animating) .card-front { display: flex; }
        .card.flipped:not(.is-animating) .card-back { display: none; }
        .card.is-animating { -webkit-transform-style: preserve-3d; transform-style: preserve-3d; }
        .ball-svg { display: block; width: 56%; max-width: 145px; height: auto; }
        .card-front img { width: 100%; height: 100%; object-fit: contain; }
        .word-card { padding: 12px 12px 10px; width: 100%; min-width: 0; max-width: none; container-type: inline-size; }
        .bopomofo-display { --name-scale: 1; gap: calc(clamp(8px, 2.8vw, 22px) * var(--name-scale)); gap: calc(clamp(8px, 3cqw, 22px) * var(--name-scale)); min-height: 86px; padding: 9px 6px; }
        .char-text { font-size: calc(clamp(36px, 10vw, 64px) * var(--name-scale)); font-size: calc(clamp(30px, 10cqw, 64px) * var(--name-scale)); }
        .zhuyin-col { font-size: calc(clamp(18px, 5vw, 28px) * var(--name-scale)); font-size: calc(clamp(16px, 5cqw, 28px) * var(--name-scale)); }
        #statusMessage { min-height: 2.7em; display: grid; place-items: center; font-size: clamp(15px, 4.2vw, 21px); overflow-wrap: anywhere; }
        .controls { align-self: end; }
        #modeBtn:disabled { opacity: .65; cursor: not-allowed; }
        @media (max-height: 670px) and (orientation: portrait) {
            .game-shell { gap: 6px; } .stage-area { gap: 6px; padding: 0; }
            .word-card { padding: 6px; } .bopomofo-display { min-height: 65px; padding: 6px; }
            #micBtn { min-height: 52px; } button.action-btn { min-height: 46px; padding: 8px; }
        }
        @media (min-width: 768px) and (max-height: 850px) and (orientation: landscape) {
            .stage-area { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); grid-template-rows: minmax(0,1fr); gap: 18px; }
        }
        @media (max-height: 540px) and (orientation: landscape) {
            .game-shell { min-height: 300px; gap: 5px; }
            .stage-area { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); grid-template-rows: minmax(0,1fr); gap: 12px; }
            .word-card { width: 100%; min-width: 0; padding: 6px; }
            .bopomofo-display { min-height: 50px; padding: 5px; gap: 8px; }
            .char-text { font-size: calc(clamp(28px, 6vw, 44px) * var(--name-scale)); }
            .zhuyin-col { font-size: calc(19px * var(--name-scale)); }
            .controls { grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
            #micBtn { grid-column: auto; min-height: 46px; } button.action-btn { min-height: 44px; padding: 6px; }
        }
        @media (max-height: 470px) and (orientation: portrait) { .game-shell { min-height: 450px; } }
        @media (prefers-reduced-motion: reduce) { .card { transition: none; } button { transition: none !important; } }
        #parentPanel { position: fixed; inset: auto max(12px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left)); z-index: 1001; max-width: 650px; margin: auto; background: white; border: 1px solid #cbd5e1; border-radius: 16px; padding: 14px; box-shadow: 0 10px 36px #17203340; max-height: 75dvh; overflow: auto; user-select: text; -webkit-user-select: text; }
        #parentPanel[hidden] { display: none; }
        #parentPanel pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; max-height: 32dvh; overflow: auto; user-select: text; -webkit-user-select: text; }
        #parentPanel button, #parentPanel select { font: inherit; padding: 9px; margin: 4px; }
    </style>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>

    <main class="game-shell">
        <div class="header-bar">
            <div class="app-badges">
                <button type="button" class="badge-pill star" id="parentTrigger" aria-label="星星計分；長按三秒開啟家長設定"><svg class="star-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l3.2 6.6 7.3 1.1-5.3 5.2 1.3 7.3-6.5-3.5-6.5 3.5 1.3-7.3L1.5 9.2l7.3-1.1z" fill="#facc15" stroke="#b77908" stroke-width="1.2" stroke-linejoin="round"/></svg><span id="starCount">0</span></button>
                <div class="badge-pill">第 <span id="questionNum">1</span> 題</div>
            </div>
            <button id="modeBtn" type="button">切換為：認字模式</button>
        </div>

        <div class="stage-area">
            <div class="card-slot"><div class="card-container">
                <div class="card" id="pokemonCard">
                    <div class="card-face card-back">
                        <svg class="ball-svg" viewBox="0 0 120 120" role="img" aria-label="寶可夢球"><circle cx="60" cy="60" r="51" fill="#fff"/><path d="M9 60a51 51 0 0 1 102 0Z" fill="#dc2635"/><path d="M20 37Q34 17 52 16" fill="none" stroke="#ff9097" stroke-width="5" stroke-linecap="round"/><circle cx="60" cy="60" r="51" fill="none" stroke="#17212b" stroke-width="6"/><path d="M9 60h102" stroke="#17212b" stroke-width="8"/><circle cx="60" cy="60" r="17" fill="#fff" stroke="#17212b" stroke-width="6"/><circle cx="60" cy="60" r="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/></svg>
                    </div>
                    <div class="card-face card-front">
                        <img id="pokemonImage" src="" alt="Pokemon" decoding="async" fetchpriority="high">
                    </div>
                </div>
            </div>

            </div>
            <div class="word-card">
                <div class="bopomofo-display" id="bopomofoText"></div>
                <div id="statusMessage" role="status" aria-live="polite">準備好了嗎？</div>
            </div>
        </div>

        <div class="controls">
            <button id="micBtn" class="action-btn" type="button">🎤 按下說話</button>
            <button id="showBtn" class="action-btn outline" type="button">看答案</button>
            <button id="nextBtn" class="action-btn secondary" type="button">下一題</button>
        </div>
    </main>

    <aside id="parentPanel" hidden aria-label="家長設定">
        <strong>V17 家長診斷</strong>
        <p>僅記錄本次開啟期間的事件與時間；不保存錄音、辨識文字或兒童作答歷史。</p>
        <label>收音策略 <select id="voiceMode"><option value="auto">自動（建議）</option><option value="compat">相容／自然結束</option><option value="fast">快速／連續收音</option></select></label>
        <button id="copyEvents" type="button">複製事件</button><button id="clearEvents" type="button">清除</button><button id="closeParent" type="button">關閉</button>
        <pre id="eventOutput"></pre>
    </aside>
    <script src="dataset.js"></script>
    <script>
        /* =========================================================
         * App 體驗增強模組（PWA 離線註冊、計分進度、答對慶祝動畫）
         * ========================================================= */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch((err) => {
                    console.warn('[PWA] Service Worker 註冊略過:', err);
                });
            });
        }

        let appStarScore = 0;
        let appQuestionCount = 0;
        let currentQuestionScored = false;

        function updateAppCounters({ incrementQuestion = false, addStar = false } = {}) {
            if (incrementQuestion) {
                appQuestionCount++;
                currentQuestionScored = false;
                const qEl = document.getElementById('questionNum');
                if (qEl) qEl.textContent = appQuestionCount;
            }
            if (addStar && !currentQuestionScored) {
                currentQuestionScored = true;
                appStarScore++;
                const sEl = document.getElementById('starCount');
                if (sEl) sEl.textContent = appStarScore;
                launchConfetti();
            }
        }

        let confettiFrame = 0;
        function stopConfetti() {
            cancelAnimationFrame(confettiFrame); confettiFrame = 0;
            const c = document.getElementById('confettiCanvas');
            const ctx = c.getContext('2d');
            if (ctx) { ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height); }
        }
        function launchConfetti() {
            stopConfetti();
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const c = document.getElementById('confettiCanvas'), ctx = c.getContext('2d');
            if (!ctx) return;
            const w = c.clientWidth, h = c.clientHeight, dpr = Math.min(devicePixelRatio || 1, 3);
            c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
            const colors = ['#ffcc00','#ff5252','#4caf50','#2196f3','#ab47bc'];
            const pieces = Array.from({length: 48}, () => ({x:w*(.2+Math.random()*.6),y:h*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*10-4,size:6+Math.random()*8,rot:Math.random()*6,vr:(Math.random()-.5)*.25,color:colors[Math.floor(Math.random()*colors.length)]}));
            const start = performance.now(); let last = start;
            function draw(now) {
                if (document.hidden || now-start > 1250) { stopConfetti(); return; }
                const dt = Math.min((now-last)/16.67, 2); last=now;
                ctx.clearRect(0,0,w,h);
                for (const p of pieces) { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=.42*dt; p.rot+=p.vr*dt;
                    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6); ctx.restore(); }
                confettiFrame=requestAnimationFrame(draw);
            }
            confettiFrame=requestAnimationFrame(draw);
        }

        /* =========================================================
         * 寶可夢拼音 / 認字挑戰 V17 Universal Stable（保留 V16 判分核心）
         * ========================================================= */

        let currentPokemon = null;
        let isReadingMode = false;
        let pinyinFn = null;

        let pinyinLoadSource = 'NOT_LOADED';

        function loadPinyinClassicScript(url, sourceLabel, timeoutMs = 6000) {
            return new Promise((resolve, reject) => {

                let settled = false;

                    settled = true;
                    clearTimeout(timer);
                    script.onload = null;
                    script.onerror = null;
                    if (ok) resolve(true);
                    else { script.remove(); reject(error || new Error(`${sourceLabel} failed`)); }
                };

                const timer = setTimeout(() => {
                    finish(false, new Error(`${sourceLabel} timeout after ${timeoutMs}ms`));
                }, timeoutMs);

                script.async = true;
                script.src = url;
                script.crossOrigin = 'anonymous';

                script.onload = () => {
                    if (registerPinyinFromGlobal(sourceLabel)) {
                        finish(true);
                    } else {
                        finish(false, new Error(`${sourceLabel} loaded but window.pinyinPro.pinyin is missing`));
                    }
                };

                script.onerror = () => {
                    finish(false, new Error(`${sourceLabel} script error`));

        function generateZhuyinHTML(name, zhuyinArray) {
            let html = '';
            const chars = Array.from(String(name || ''));

            for (let i = 0; i < chars.length; i++) {
                const char = chars[i];
                const bpmf = zhuyinArray[i] || '';

                if (isSilentNameSymbol(char)) {
                    html += `
                        <div class="char-block symbol-only" aria-hidden="true">
                            <div class="char-text">${escapeHtml(char)}</div>
                        </div>
                    `;
                    continue;
                }

                if (!isRealZhuyin(bpmf)) {
                    html += `
                        <div class="char-block symbol-only">
                            <div class="char-text">${escapeHtml(char)}</div>
                        </div>
                    `;
                    continue;
                }

                let tone = '';
                let lightTone = '';
                let mainBpmf = bpmf;

                if (bpmf.startsWith('˙')) {
                    lightTone = '˙';
                    mainBpmf = bpmf.substring(1);
                } else if (bpmf.endsWith('˙')) {
                    lightTone = '˙';
                    mainBpmf = bpmf.slice(0, -1);
                } else if (['ˊ', 'ˇ', 'ˋ'].includes(bpmf.slice(-1))) {
                    tone = bpmf.slice(-1);
                    mainBpmf = bpmf.slice(0, -1);
                }

                const bpmfSpans = mainBpmf
                    .split('')
                    .map(b => `<span>${escapeHtml(b)}</span>`)
                    .join('');

                html += `
                    <div class="char-block">
                        <div class="char-text">${escapeHtml(char)}</div>
                        <div class="zhuyin-col">
                            ${lightTone ? `<div class="tone-light">${lightTone}</div>` : ''}
                            <div class="bpmf-stack">${bpmfSpans}</div>
                            ${tone ? `<div class="tone-side">${tone}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function normalizeZhuyinSyllable(value) {

        function pinyinSyllableToZhuyin(rawSyllable) {
            let syllable = String(rawSyllable || '')
                .toLowerCase()
                .replace(/u:/g, 'v')
                .replace(/ü/g, 'v')
                .replace(/[^a-zv]/g, '');

            if (!syllable) return '';

            const zeroInitialMap = {
                yi: 'ㄧ', ya: 'ㄧㄚ', yo: 'ㄧㄛ', ye: 'ㄧㄝ', yai: 'ㄧㄞ',
                yao: 'ㄧㄠ', you: 'ㄧㄡ', yan: 'ㄧㄢ', yin: 'ㄧㄣ', yang: 'ㄧㄤ',
                ying: 'ㄧㄥ', yong: 'ㄩㄥ', yu: 'ㄩ', yue: 'ㄩㄝ', yuan: 'ㄩㄢ',
                yun: 'ㄩㄣ', wu: 'ㄨ', wa: 'ㄨㄚ', wo: 'ㄨㄛ', wai: 'ㄨㄞ',
                wei: 'ㄨㄟ', wan: 'ㄨㄢ', wen: 'ㄨㄣ', wang: 'ㄨㄤ', weng: 'ㄨㄥ'
            };

            if (zeroInitialMap[syllable]) return zeroInitialMap[syllable];

            const initialMap = {
                zh: 'ㄓ', ch: 'ㄔ', sh: 'ㄕ',
                b: 'ㄅ', p: 'ㄆ', m: 'ㄇ', f: 'ㄈ',
                d: 'ㄉ', t: 'ㄊ', n: 'ㄋ', l: 'ㄌ',
                g: 'ㄍ', k: 'ㄎ', h: 'ㄏ',
                j: 'ㄐ', q: 'ㄑ', x: 'ㄒ',
                r: 'ㄖ', z: 'ㄗ', c: 'ㄘ', s: 'ㄙ'
            };

            const finalMap = {
                a: 'ㄚ', o: 'ㄛ', e: 'ㄜ', ai: 'ㄞ', ei: 'ㄟ', ao: 'ㄠ', ou: 'ㄡ',
                an: 'ㄢ', en: 'ㄣ', ang: 'ㄤ', eng: 'ㄥ', er: 'ㄦ',
                i: 'ㄧ', ia: 'ㄧㄚ', ie: 'ㄧㄝ', iao: 'ㄧㄠ', iu: 'ㄧㄡ', iou: 'ㄧㄡ',
                ian: 'ㄧㄢ', in: 'ㄧㄣ', iang: 'ㄧㄤ', ing: 'ㄧㄥ', iong: 'ㄩㄥ',
                u: 'ㄨ', ua: 'ㄨㄚ', uo: 'ㄨㄛ', uai: 'ㄨㄞ', ui: 'ㄨㄟ', uei: 'ㄨㄟ',
                uan: 'ㄨㄢ', un: 'ㄨㄣ', uen: 'ㄨㄣ', uang: 'ㄨㄤ', ong: 'ㄨㄥ', ueng: 'ㄨㄥ',
                v: 'ㄩ', ve: 'ㄩㄝ', van: 'ㄩㄢ', vn: 'ㄩㄣ'
            };

            let initial = '';
            let rest = syllable;

            for (const candidate of ['zh', 'ch', 'sh']) {
                if (syllable.startsWith(candidate)) {
                    initial = candidate;
                    rest = syllable.slice(candidate.length);
                    break;
                }
            }

            if (!initial && initialMap[syllable[0]]) {
                initial = syllable[0];
                rest = syllable.slice(1);
            }

            if (rest === 'i' && ['zh', 'ch', 'sh', 'r', 'z', 'c', 's'].includes(initial)) {
                return initialMap[initial] || '';
            }

            if (['j', 'q', 'x'].includes(initial)) {
                if (rest === 'u') rest = 'v';
                else if (rest === 'ue') rest = 've';
                else if (rest === 'uan') rest = 'van';
                else if (rest === 'un') rest = 'vn';
            }

            const initialZhuyin = initialMap[initial] || '';
            const finalZhuyin = finalMap[rest] || '';

            if (!initial && finalZhuyin) return finalZhuyin;
            if (initialZhuyin && (finalZhuyin || rest === '')) return initialZhuyin + finalZhuyin;
            return '';
        }

        function normalizeNameForComparison(text) {
            return String(text || '')
                .normalize('NFKC')
                .replace(/[：:・．.·•‧\s]/g, '')
                .replace(/[^\u3400-\u9fffA-Za-z0-9üÜ]/g, '')

        function recognizedTextToZhuyin(text) {
            if (!pinyinFn || !text) return [];
            try {
                const pinyinArray = pinyinFn(text, {
                    toneType: 'none',
                    type: 'array',

        function levenshteinDistance(a, b) {
            a = String(a || '');
            b = String(b || '');
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;

            const previous = new Array(b.length + 1);
            const current = new Array(b.length + 1);
            for (let j = 0; j <= b.length; j++) previous[j] = j;

            for (let i = 1; i <= a.length; i++) {
                current[0] = i;
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    current[j] = Math.min(current[j - 1] + 1, previous[j] + 1, previous[j - 1] + cost);
                }
                for (let j = 0; j <= b.length; j++) previous[j] = current[j];
            }
            return previous[b.length];
        }

        function stringSimilarity(a, b) {
            a = String(a || '');
            b = String(b || '');
            if (!a && !b) return 100;
            if (!a || !b) return 0;
            if (a === b) return 100;
            const maxLength = Math.max(a.length, b.length);
            const distance = levenshteinDistance(a, b);
            return Math.max(0, (1 - distance / maxLength) * 100);
        }

        const ZHUYIN_INITIALS = new Set([
            'ㄅ', 'ㄆ', 'ㄇ', 'ㄈ', 'ㄉ', 'ㄊ', 'ㄋ', 'ㄌ',
            'ㄍ', 'ㄎ', 'ㄏ', 'ㄐ', 'ㄑ', 'ㄒ', 'ㄓ', 'ㄔ',
            'ㄕ', 'ㄖ', 'ㄗ', 'ㄘ', 'ㄙ'
        ]);

        const CLOSE_INITIAL_GROUPS = [
            new Set(['ㄓ', 'ㄗ']), new Set(['ㄔ', 'ㄘ']), new Set(['ㄕ', 'ㄙ']),
            new Set(['ㄋ', 'ㄌ']), new Set(['ㄌ', 'ㄖ']), new Set(['ㄐ', 'ㄑ']),
            new Set(['ㄑ', 'ㄒ'])
        ];

        const CLOSE_FINAL_GROUPS = [
            new Set(['ㄣ', 'ㄥ']), new Set(['ㄢ', 'ㄤ']), new Set(['ㄧㄣ', 'ㄧㄥ'])
        ];

        function splitZhuyinSyllable(value) {
            const syllable = normalizeZhuyinSyllable(value);
            if (!syllable) return { initial: '', final: '' };
            const first = syllable[0];
            if (ZHUYIN_INITIALS.has(first)) {
                return { initial: first, final: syllable.slice(1) };
            }
            return { initial: '', final: syllable };
        }

        function inSameCloseGroup(a, b, groups) {
            if (!a || !b || a === b) return false;
            return groups.some(group => group.has(a) && group.has(b));
        }

        function isConservativeCloseSyllable(a, b) {
            a = normalizeZhuyinSyllable(a);
            b = normalizeZhuyinSyllable(b);
            if (!a || !b || a === b) return false;

            const left = splitZhuyinSyllable(a);
            const right = splitZhuyinSyllable(b);

            if (left.final && left.final === right.final && inSameCloseGroup(left.initial, right.initial, CLOSE_INITIAL_GROUPS)) {
                return true;
            }
            if (left.initial === right.initial && inSameCloseGroup(left.final, right.final, CLOSE_FINAL_GROUPS)) {
                return true;

                else releaseWatchdog(session,'nomatch without end');
            };
            recognition.onerror=event=>{
                if(!live(session)) return;
                const name=event.error||'unknown';trace(session,'ERROR',name);
                if(session.resultHandled) {if(!session.serviceEnded)releaseWatchdog(session,'error after result');return;}
                if(name==='aborted' && session.abortRequested) return;
                session.userMessageHandled=true;
                if(name==='not-allowed'||name==='service-not-allowed') setStatus('請允許使用麥克風，或在 Safari 中開啟。','error');
                else if(name==='audio-capture') setStatus('麥克風無法使用，請檢查裝置設定。','error');
                else if(name==='network') setStatus('語音服務連線失敗，請確認網路。','error');
                else if(name==='no-speech') setStatus('沒有辨識到說話內容，請再試一次。','retry');
                else {session.userMessageHandled=false;markFault(session,name);}
                if(!session.serviceEnded)releaseWatchdog(session,'error without end');
            };
            recognition.onend=()=>{
                if(session.finished||session.serviceEnded) return;
                session.serviceEnded=true;trace(session,'END');clearTimers(session);
                if(!isCurrentSession(session)||session.cancelled){finishSession(session,true);return;}
                timer(session,'endGraceTimer',END_RESULT_GRACE_MS,()=>{
                    if(!session.resultHandled){
                        if(session.candidateMap.size) finalizeRecognitionDecision(session,'natural end');
                        else if(!session.userMessageHandled) {
                            if(session.speechStarted || !session.audioStarted) markFault(session,'end without recognition result');
                            else { session.userMessageHandled=true; setStatus('沒有辨識到說話內容，請再試一次。','retry'); }
                        }
                    }
                    finishSession(session,true);
                });
            };
            return session;
        }
        function startRecognition() {
            if(!initialized||!pinyinHealthy||!SpeechRecognition||!currentPokemon||activeSession||cardAnimating||isChangingQuestion||document.hidden||performance.now()<cooldownUntil) return;
            let session;
            try {session=createRecognitionSession();} catch(e) {setStatus('語音服務無法啟動，請重新開啟。','error');trace(null,'CREATE_ERROR',e.name||'error');return;}
            activeSession=session;refreshControls();setStatus('麥克風準備中，等提示再說話');setMicBusy(true,'⏳ 準備中…');
            trace(session,'CREATE',`mode=${session.strategy} max=${session.recordingLimitMs}`);
            timer(session,'startTimer',START_TIMEOUT_MS,()=>{markFault(session,'start timeout');forceAbort(session,'start timeout');});
            timer(session,'hardLimitTimer',HARD_LIMIT_MS,()=>{
                if(!session.resultHandled&&!session.userMessageHandled) {
                    if(session.candidateMap.size) finalizeRecognitionDecision(session,'hard limit'); else markFault(session,'hard limit');
                }
                forceAbort(session,'hard limit');
            });
            // start() stays synchronous within the real tap. Never auto-start from a timer.
            try {session.recognition.start();} catch(e) {markFault(session,'start threw '+(e.name||'error'));finishSession(session,false);}
        }
        modeBtn.addEventListener('click',()=>{
            if(activeSession||isChangingQuestion||cardAnimating||!currentPokemon) return;
            isReadingMode=!isReadingMode;modeBtn.textContent=isReadingMode?'切換為：拼音模式':'切換為：認字模式';loadRandomPokemon();
        });
        micBtn.addEventListener('click',startRecognition);
        showBtn.addEventListener('click',()=>{if(activeSession||isChangingQuestion||cardAnimating||!currentPokemon)return;revealAnswer();setStatus(`答案是：${currentPokemon.name}`);});
        nextBtn.addEventListener('click',()=>{if(!activeSession&&!isChangingQuestion&&!cardAnimating&&currentPokemon)loadRandomPokemon();});
        document.addEventListener('visibilitychange',()=>{
            if(document.hidden){stopConfetti();cancelActiveRecognition('background');}
            else {trace(null,'FOREGROUND'); if(!activeSession){beginCooldown(appleMobile?450:100);if(currentPokemon&&!card.classList.contains('flipped')) showQuestionPrompt();}}
        });
        window.addEventListener('pagehide',()=>{stopConfetti();cancelActiveRecognition('pagehide');});
        window.addEventListener('pageshow',e=>{if(e.persisted){cancelActiveRecognition('pageshow restore');refreshControls();}});
        // Parent-only panel: bounded in-memory event summaries; no speech text or persistent history.
        let holdTimer;const trigger=document.getElementById('parentTrigger');
        function openParent(){parentPanel.hidden=false;renderEvents();}
        trigger.addEventListener('pointerdown',()=>{clearTimeout(holdTimer);holdTimer=setTimeout(openParent,3000);});
        for(const type of ['pointerup','pointercancel','pointerleave'])trigger.addEventListener(type,()=>clearTimeout(holdTimer));
        trigger.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openParent();}});
        trigger.addEventListener('contextmenu',e=>e.preventDefault());
        document.getElementById('closeParent').onclick=()=>{parentPanel.hidden=true;};
        document.getElementById('clearEvents').onclick=()=>{events.length=0;renderEvents();};
        document.getElementById('voiceMode').onchange=e=>{strategyPreference=e.target.value;autoCompat=false;consecutiveFaults=0;trace(null,'STRATEGY',strategyPreference);renderEvents();};
        document.getElementById('copyEvents').onclick=async()=>{
            const output=document.getElementById('eventOutput');
            try{await navigator.clipboard.writeText(output.textContent);document.getElementById('copyEvents').textContent='已複製';}
            catch(e){const r=document.createRange();r.selectNodeContents(output);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);document.getElementById('copyEvents').textContent='請手動複製選取文字';}
        };
        refreshControls();


    </script>
</body>
