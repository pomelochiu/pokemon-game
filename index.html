                if (pendingMicStart) {
                    pendingMicStart = false;
                    setTimeout(() => {
                        if (!isChangingQuestion) {
                            startRecognition();
                        }
                    }, 0);
                }
            };

            const onCardTransitionEnd = (event) => {
                if (event.target !== card || event.propertyName !== 'transform') {
                    return;
                }

                finishQuestionChange();
            };

            card.addEventListener('transitionend', onCardTransitionEnd);
            card.classList.remove('flipped');

            fallbackTimer = setTimeout(
                finishQuestionChange,
                950
            );
        }

        /* =========================================================
         * 注音 / 拼音正規化
         * ========================================================= */

        function normalizeZhuyinSyllable(value) {
            return String(value || '')
                .replace(/[ˊˇˋ˙ˉ]/g, '')
                .replace(/\s+/g, '')
                .trim();
        }

        function getTargetZhuyin(pokemon) {
            if (!pokemon || !Array.isArray(pokemon.zhuyin)) {
                return [];
            }

            const chars = Array.from(String(pokemon.name || ''));

            return pokemon.zhuyin
                .map((value, index) => {
                    const char = chars[index] || '';

                    /* ：、・等無聲符號完全不參與發音答案。 */
                    if (isSilentNameSymbol(char)) {
                        return '';
                    }

                    const normalized = normalizeZhuyinSyllable(value);

                    /*
                     * Ｑ、Ｚ、Ⅱ 等不是注音字串：保留名稱顯示，但不讓它們
                     * 被錯當成一個注音音節，避免莫名拉低相似度。
                     */
                    return /[ㄅ-ㄩ]/.test(normalized) ? normalized : '';
                })
                .filter(Boolean);
        }

        /*
         * 將 pinyin-pro 產生的無聲調拼音，轉成無聲調注音。
         *
         * 這樣「標準答案」完全來自 dataset.js 的 zhuyin，
         * 不再讓 pinyin-pro 重新猜寶可夢名稱的讀音。
         */
        function pinyinSyllableToZhuyin(rawSyllable) {
            let syllable = String(rawSyllable || '')
                .toLowerCase()
                .replace(/u:/g, 'v')
                .replace(/ü/g, 'v')
                .replace(/[^a-zv]/g, '');

            if (!syllable) {
                return '';
            }

            const zeroInitialMap = {
                yi: 'ㄧ',
                ya: 'ㄧㄚ',
                yo: 'ㄧㄛ',
                ye: 'ㄧㄝ',
                yai: 'ㄧㄞ',
                yao: 'ㄧㄠ',
                you: 'ㄧㄡ',
                yan: 'ㄧㄢ',
                yin: 'ㄧㄣ',
                yang: 'ㄧㄤ',
                ying: 'ㄧㄥ',
                yong: 'ㄩㄥ',
                yu: 'ㄩ',
                yue: 'ㄩㄝ',
                yuan: 'ㄩㄢ',
                yun: 'ㄩㄣ',
                wu: 'ㄨ',
                wa: 'ㄨㄚ',
                wo: 'ㄨㄛ',
                wai: 'ㄨㄞ',
                wei: 'ㄨㄟ',
                wan: 'ㄨㄢ',
                wen: 'ㄨㄣ',
                wang: 'ㄨㄤ',
                weng: 'ㄨㄥ'
            };

            if (zeroInitialMap[syllable]) {
                return zeroInitialMap[syllable];
            }

            const initialMap = {
                zh: 'ㄓ',
                ch: 'ㄔ',
                sh: 'ㄕ',
                b: 'ㄅ',
                p: 'ㄆ',
                m: 'ㄇ',
                f: 'ㄈ',
                d: 'ㄉ',
                t: 'ㄊ',
                n: 'ㄋ',
                l: 'ㄌ',
                g: 'ㄍ',
                k: 'ㄎ',
                h: 'ㄏ',
                j: 'ㄐ',
                q: 'ㄑ',
                x: 'ㄒ',
                r: 'ㄖ',
                z: 'ㄗ',
                c: 'ㄘ',
                s: 'ㄙ'
            };

            const finalMap = {
                a: 'ㄚ',
                o: 'ㄛ',
                e: 'ㄜ',
                ai: 'ㄞ',
                ei: 'ㄟ',
                ao: 'ㄠ',
                ou: 'ㄡ',
                an: 'ㄢ',
                en: 'ㄣ',
                ang: 'ㄤ',
                eng: 'ㄥ',
                er: 'ㄦ',

                i: 'ㄧ',
                ia: 'ㄧㄚ',
                ie: 'ㄧㄝ',
                iao: 'ㄧㄠ',
                iu: 'ㄧㄡ',
                iou: 'ㄧㄡ',
                ian: 'ㄧㄢ',
                in: 'ㄧㄣ',
                iang: 'ㄧㄤ',
                ing: 'ㄧㄥ',
                iong: 'ㄩㄥ',

                u: 'ㄨ',
                ua: 'ㄨㄚ',
                uo: 'ㄨㄛ',
                uai: 'ㄨㄞ',
                ui: 'ㄨㄟ',
                uei: 'ㄨㄟ',
                uan: 'ㄨㄢ',
                un: 'ㄨㄣ',
                uen: 'ㄨㄣ',
                uang: 'ㄨㄤ',
                ong: 'ㄨㄥ',
                ueng: 'ㄨㄥ',

                v: 'ㄩ',
                ve: 'ㄩㄝ',
                van: 'ㄩㄢ',
                vn: 'ㄩㄣ'
            };

            let initial = '';
            let rest = syllable;

            for (const candidate of ['zh', 'ch', 'sh']) {
                if (syllable.startsWith(candidate)) {
                    initial = candidate;
                    rest = syllable.slice(candidate.length);
                    break;
                }
            }

            if (!initial && initialMap[syllable[0]]) {
                initial = syllable[0];
                rest = syllable.slice(1);
            }

            /* ㄓ ㄔ ㄕ ㄖ ㄗ ㄘ ㄙ 的「i」不另外寫 ㄧ */
            if (
                rest === 'i' &&
                ['zh', 'ch', 'sh', 'r', 'z', 'c', 's'].includes(initial)
            ) {
                return initialMap[initial] || '';
            }

            /* ju / qu / xu 的 u 實際代表 ㄩ */
            if (['j', 'q', 'x'].includes(initial)) {
                if (rest === 'u') rest = 'v';
                else if (rest === 'ue') rest = 've';
                else if (rest === 'uan') rest = 'van';
                else if (rest === 'un') rest = 'vn';
            }

            const initialZhuyin = initialMap[initial] || '';
            const finalZhuyin = finalMap[rest] || '';

            if (!initial && finalZhuyin) {
                return finalZhuyin;
            }

            if (initialZhuyin && (finalZhuyin || rest === '')) {
                return initialZhuyin + finalZhuyin;
            }

            console.warn('無法轉換拼音音節：', rawSyllable);
            return '';
        }

        function normalizeNameForComparison(text) {
            return String(text || '')
                .normalize('NFKC')
                .replace(/[：:・．.·•‧\s]/g, '')
                .replace(/[^\u3400-\u9fffA-Za-z0-9üÜ]/g, '')
                .toLowerCase()
                .trim();
        }

        function cleanRecognizedText(text) {
            return normalizeNameForComparison(text);
        }

        function recognizedTextToZhuyin(text) {
            if (!pinyinFn || !text) {
                return [];
            }

            try {
                const pinyinArray = pinyinFn(text, {
                    toneType: 'none',
                    type: 'array',
                    /* Q / Z / 數字等非中文字不轉成假注音。 */
                    nonZh: 'removed'
                });

                return pinyinArray
                    .map(item => pinyinSyllableToZhuyin(item))
                    .filter(Boolean);
            } catch (error) {
                console.warn('辨識文字轉注音失敗：', error);
                return [];
            }
        }

        /* =========================================================
         * 相似度
         * ========================================================= */

        function levenshteinDistance(a, b) {
            a = String(a || '');
            b = String(b || '');

            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;

            const previous = new Array(b.length + 1);
            const current = new Array(b.length + 1);

            for (let j = 0; j <= b.length; j++) {
                previous[j] = j;
            }

            for (let i = 1; i <= a.length; i++) {
                current[0] = i;

                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;

                    current[j] = Math.min(
                        current[j - 1] + 1,
                        previous[j] + 1,
                        previous[j - 1] + cost
                    );
                }

                for (let j = 0; j <= b.length; j++) {
                    previous[j] = current[j];
                }
            }

            return previous[b.length];
        }

        function stringSimilarity(a, b) {
            a = String(a || '');
            b = String(b || '');

            if (!a && !b) return 100;
            if (!a || !b) return 0;
            if (a === b) return 100;

            const maxLength = Math.max(a.length, b.length);
            const distance = levenshteinDistance(a, b);

            return Math.max(0, (1 - distance / maxLength) * 100);
        }

        /*
         * 注音音節拆解：
         * 聲母只有第一個符號；其餘視為韻母/介音組合。
         * 這裡不處理聲調，因為 normalizeZhuyinSyllable() 已經移除聲調。
         */
        const ZHUYIN_INITIALS = new Set([
            'ㄅ', 'ㄆ', 'ㄇ', 'ㄈ',
            'ㄉ', 'ㄊ', 'ㄋ', 'ㄌ',
            'ㄍ', 'ㄎ', 'ㄏ',
            'ㄐ', 'ㄑ', 'ㄒ',
            'ㄓ', 'ㄔ', 'ㄕ', 'ㄖ',
            'ㄗ', 'ㄘ', 'ㄙ'
        ]);

        /*
         * 只列「語音辨識服務很常互相轉寫」的近音。
         * 這不是把它們當作完全相同；只有在長名稱且只錯這一個音節時才可能救援。
         */
        const CLOSE_INITIAL_GROUPS = [
            new Set(['ㄓ', 'ㄗ']),
            new Set(['ㄔ', 'ㄘ']),
            new Set(['ㄕ', 'ㄙ']),
            new Set(['ㄋ', 'ㄌ']),
            new Set(['ㄌ', 'ㄖ']),
            new Set(['ㄐ', 'ㄑ']),
            new Set(['ㄑ', 'ㄒ'])
        ];

        const CLOSE_FINAL_GROUPS = [
            new Set(['ㄣ', 'ㄥ']),
            new Set(['ㄢ', 'ㄤ']),
            new Set(['ㄧㄣ', 'ㄧㄥ'])
        ];

        function splitZhuyinSyllable(value) {
            const syllable = normalizeZhuyinSyllable(value);
            if (!syllable) {
                return { initial: '', final: '' };
            }

            const first = syllable[0];
            if (ZHUYIN_INITIALS.has(first)) {
                return {
                    initial: first,
                    final: syllable.slice(1)
                };
            }

            return {
                initial: '',
                final: syllable
            };
        }

        function inSameCloseGroup(a, b, groups) {
            if (!a || !b || a === b) return false;

            return groups.some(group => group.has(a) && group.has(b));
        }

        function isConservativeCloseSyllable(a, b) {
            a = normalizeZhuyinSyllable(a);
            b = normalizeZhuyinSyllable(b);

            if (!a || !b || a === b) {
                return false;
            }

            const left = splitZhuyinSyllable(a);
            const right = splitZhuyinSyllable(b);

            /*
             * Case A：韻母完全相同，只差一組常見近音聲母。
             * 例：ㄑㄧㄡ / ㄐㄧㄡ
             */
            if (
                left.final &&
                left.final === right.final &&
                inSameCloseGroup(left.initial, right.initial, CLOSE_INITIAL_GROUPS)
            ) {
                return true;
            }

            /*
             * Case B：聲母完全相同，只差一組常見近音韻母。
             * 例：ㄌㄧㄣ / ㄌㄧㄥ（是否救援仍要通過整題的嚴格條件）
             */
            if (
                left.initial === right.initial &&
                inSameCloseGroup(left.final, right.final, CLOSE_FINAL_GROUPS)
            ) {
                return true;
            }

            return false;
        }

        function zhuyinSequenceScore(spokenZhuyin, targetZhuyin) {
            if (!spokenZhuyin.length || !targetZhuyin.length) {
                return 0;
            }

            const spokenJoined = spokenZhuyin.join('');
            const targetJoined = targetZhuyin.join('');
            const wholeStringScore = stringSimilarity(spokenJoined, targetJoined);
            const maxCount = Math.max(spokenZhuyin.length, targetZhuyin.length);

            let syllableTotal = 0;

            for (let i = 0; i < maxCount; i++) {
                syllableTotal += stringSimilarity(
                    spokenZhuyin[i] || '',
                    targetZhuyin[i] || ''
                );
            }

            const syllableScore = syllableTotal / maxCount;

            /*
             * 仍維持既有 70% 每音節 + 30% 整體的核心分數。
             * 近音救援不直接混進這個分數，避免整體判分全面變鬆。
             */
            return Math.round(
                syllableScore * 0.7 +
                wholeStringScore * 0.3
            );
        }

        function analyzeConservativePhoneticRescue(bestWindow, targetZhuyin) {
            const targetLength = targetZhuyin.length;

            /*
             * 兩音節名稱錯一個音就等於錯一半，因此完全不使用近音救援。
             * 至少三音節才有資格。
             */
            if (
                targetLength < 3 ||
                bestWindow.length !== targetLength
            ) {
                return {
                    eligible: false,
                    exactCount: 0,
                    closeCount: 0,
                    mismatchCount: Math.max(bestWindow.length, targetLength)
                };
            }

            let exactCount = 0;
            let closeCount = 0;
            let mismatchCount = 0;

            for (let i = 0; i < targetLength; i++) {
                const spoken = normalizeZhuyinSyllable(bestWindow[i]);
                const target = normalizeZhuyinSyllable(targetZhuyin[i]);

                if (spoken === target) {
                    exactCount++;
                    continue;
                }

                mismatchCount++;

                if (isConservativeCloseSyllable(spoken, target)) {
                    closeCount++;
                }
            }

            /*
             * 最嚴格條件：
             * - 只有 1 個音節不同
             * - 那 1 個必須是已知近音
             * - 其他所有音節完全一致
             */
            const eligible =
                mismatchCount === 1 &&
                closeCount === 1 &&
                exactCount === targetLength - 1;

            return {
                eligible,
                exactCount,
                closeCount,
                mismatchCount
            };
        }

        function getBestZhuyinScore(spokenZhuyin, targetZhuyin) {
            if (!spokenZhuyin.length || !targetZhuyin.length) {
                return {
                    score: 0,
                    bestWindow: []
                };
            }

            const targetLength = targetZhuyin.length;
            let bestScore = 0;
            let bestWindow = spokenZhuyin;

            /*
             * 容許使用者說「答案是皮卡丘」、「我猜皮卡丘」等句型。
             * 如果辨識句子比較長，就找其中最像答案的一段。
             */
            if (spokenZhuyin.length >= targetLength) {
                for (
                    let start = 0;
                    start <= spokenZhuyin.length - targetLength;
                    start++
                ) {
                    const window = spokenZhuyin.slice(start, start + targetLength);
                    const score = zhuyinSequenceScore(window, targetZhuyin);

                    if (score > bestScore) {
                        bestScore = score;
                        bestWindow = window;
                    }
                }
            } else {
                bestScore = zhuyinSequenceScore(spokenZhuyin, targetZhuyin);
            }

            return {
                score: Math.round(bestScore),
                bestWindow
            };
        }

        function evaluateTranscript(transcript, pokemon) {
            const cleanText = cleanRecognizedText(transcript);
            const targetZhuyin = getTargetZhuyin(pokemon);

            if (!cleanText) {
                return {
                    transcript,
                    cleanText,
                    score: 0,
                    rawScore: 0,
                    spokenZhuyin: [],
                    targetZhuyin,
                    bestWindow: [],
                    exactTextMatch: false,
                    exactZhuyinMatch: false,
                    phoneticRescue: false,
                    matchType: 'empty'
                };
            }

            /*
             * 如果語音服務直接辨識出了正確寶可夢名稱，
             * 或句子裡包含正確名稱，直接視為 100。
             */
            const normalizedTargetName = normalizeNameForComparison(pokemon.name);

            if (
                normalizedTargetName &&
                cleanText.includes(normalizedTargetName)
            ) {
                return {
                    transcript,
                    cleanText,
                    score: 100,
                    rawScore: 100,
                    spokenZhuyin: recognizedTextToZhuyin(cleanText),
                    targetZhuyin,
                    bestWindow: targetZhuyin,
                    exactTextMatch: true,
                    exactZhuyinMatch: true,
                    phoneticRescue: false,
                    matchType: 'exact-text'
                };
            }

            if (!pinyinFn) {
                return {
                    transcript,
                    cleanText,
                    score: 0,
                    rawScore: 0,
                    spokenZhuyin: [],
                    targetZhuyin,
                    bestWindow: [],
                    exactTextMatch: false,
                    exactZhuyinMatch: false,
                    phoneticRescue: false,
                    matchType: 'pinyin-unavailable'
                };
            }

            const spokenZhuyin = recognizedTextToZhuyin(cleanText);
            const result = getBestZhuyinScore(spokenZhuyin, targetZhuyin);

            const exactZhuyinMatch =
                result.bestWindow.length === targetZhuyin.length &&
                targetZhuyin.length > 0 &&
                result.bestWindow.every(
                    (value, index) =>
                        normalizeZhuyinSyllable(value) ===
                        normalizeZhuyinSyllable(targetZhuyin[index])
                );

            if (exactZhuyinMatch) {
                return {
                    transcript,
                    cleanText,
                    score: 100,
                    rawScore: result.score,
                    spokenZhuyin,
                    targetZhuyin,
                    bestWindow: result.bestWindow,
                    exactTextMatch: false,
                    exactZhuyinMatch: true,
                    phoneticRescue: false,
                    matchType: 'exact-zhuyin'
                };
            }

            const rescue = analyzeConservativePhoneticRescue(
                result.bestWindow,
                targetZhuyin
            );

            /*
             * 近音救援固定只拉到 91：
             * 足以跨過 90 的正確門檻，但不偽裝成 100 分。
             * 且只有非常嚴格的「長名稱只差一個已知近音」才會觸發。
             */
            const finalScore = rescue.eligible
                ? Math.max(result.score, 91)
                : result.score;

            return {
                transcript,
                cleanText,
                score: finalScore,
                rawScore: result.score,
                spokenZhuyin,
                targetZhuyin,
                bestWindow: result.bestWindow,
                exactTextMatch: false,
                exactZhuyinMatch: false,
                phoneticRescue: rescue.eligible,
                phoneticDetails: rescue,
                matchType: rescue.eligible ? 'phonetic-rescue' : 'similarity'
            };
        }

        /* =========================================================
         * SpeechRecognition Session - V14 Diagnostic
         * ========================================================= */

        const DIAG_STORAGE_KEY = 'pokemonSpeechDiagnosticsV14';
        const DIAG_MAX_SESSIONS = 30;
        const MAX_DIAG_EVENTS_PER_SESSION = 120;

        let diagnosticHistory = loadDiagnosticHistory();

        function nowIso() {
            return new Date().toISOString();
        }

        function round3(value) {
            return typeof value === 'number'
                ? Math.round(value * 1000) / 1000
                : null;
        }

        function loadDiagnosticHistory() {
            try {
                const raw = localStorage.getItem(DIAG_STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.warn('讀取語音診斷紀錄失敗：', error);
                return [];
            }
        }

        function saveDiagnosticHistory() {
            try {
                localStorage.setItem(
                    DIAG_STORAGE_KEY,
                    JSON.stringify(diagnosticHistory.slice(-DIAG_MAX_SESSIONS))
                );
            } catch (error) {
                console.warn('儲存語音診斷紀錄失敗：', error);
            }
        }

        function getEnvironmentSnapshot() {
            return {
                time: nowIso(),
                userAgent: navigator.userAgent || '',
                platform: navigator.platform || '',
                language: navigator.language || '',
                online: typeof navigator.onLine === 'boolean' ? navigator.onLine : null,
                protocol: location.protocol,
                secureContext: Boolean(window.isSecureContext),
                speechApi: window.SpeechRecognition
                    ? 'SpeechRecognition'
                    : (window.webkitSpeechRecognition ? 'webkitSpeechRecognition' : 'none'),
                pinyinProLoaded: Boolean(pinyinFn),
                pinyinLoadSource,
                pinyinLoadAttempts: pinyinLoadAttempts.slice()
            };
        }

        function addDiagEvent(session, type, details = {}) {
            if (!session || !session.diag) return;

            const elapsedMs = Math.round(performance.now() - session.createdAt);
            const event = {
                seq: session.diag.events.length + 1,
                elapsedMs,
                type,
                ...details
            };

            session.diag.events.push(event);

            if (session.diag.events.length > MAX_DIAG_EVENTS_PER_SESSION) {
                session.diag.events.shift();
            }

            console.log(`[Speech #${session.id}] ${type} +${elapsedMs}ms`, details);
        }

        function snapshotRecognitionResults(event) {
            const snapshot = {
                resultIndex:
                    event && typeof event.resultIndex === 'number'
                        ? event.resultIndex
                        : null,
                results: []
            };

            if (!event || !event.results) return snapshot;

            for (let resultIndex = 0; resultIndex < event.results.length; resultIndex++) {
                const result = event.results[resultIndex];
                if (!result) continue;

                const item = {
                    index: resultIndex,
                    isFinal: Boolean(result.isFinal),
                    alternatives: []
                };

                for (let i = 0; i < result.length && i < MAX_ALTERNATIVES; i++) {
                    const alt = result[i];
                    item.alternatives.push({
                        rank: i + 1,
                        transcript: alt && alt.transcript ? alt.transcript.trim() : '',
                        confidence:
                            alt && typeof alt.confidence === 'number'
                                ? round3(alt.confidence)
                                : null
                    });
                }

                snapshot.results.push(item);
            }

            return snapshot;
        }

        function isCurrentSession(session) {
            return activeSession === session;
        }

        function clearSessionTimers(session) {
            if (!session) return;

            [
                'preSpeechTimer',
                'recordingTimer',
                'speechEndTimer',
                'audioStopWatchdogTimer',
                'resultWaitTimer',
                'endGraceTimer',
                'hardLimitTimer',
                'abortSettleTimer',
                'earlyDecisionTimer'
            ].forEach(key => {
                clearTimeout(session[key]);
                session[key] = null;
            });
        }

        function logLifecycle(session, eventName, extra = '') {
            addDiagEvent(session, eventName, extra ? { extra } : {});
        }

        function normalizeCandidateKey(transcript) {
            return String(transcript || '')
                .replace(/[\s，。！？、,.!?：:；;「」『』（）()【】\[\]]+/g, '')
                .trim();
        }

        function addCandidate(session, candidate) {
            if (!session || !candidate || !candidate.transcript) return;

            const transcript = String(candidate.transcript).trim();
            const key = normalizeCandidateKey(transcript);
            if (!key) return;

            let entry = session.candidateMap.get(key);

            if (!entry) {
                entry = {
                    transcript,
                    sources: new Set(),
                    seenCount: 0,
                    finalSeen: false,
                    interimSeen: false,
                    bestConfidence: null,
                    firstSeenMs: Math.round(performance.now() - session.createdAt),
                    lastSeenMs: null
                };
                session.candidateMap.set(key, entry);
            }

            entry.seenCount++;
            entry.lastSeenMs = Math.round(performance.now() - session.createdAt);
            entry.sources.add(candidate.source || 'UNKNOWN');

            if (candidate.isFinal) entry.finalSeen = true;
            if (candidate.isInterim) entry.interimSeen = true;

            if (
                typeof candidate.confidence === 'number' &&
                (
                    entry.bestConfidence === null ||
                    candidate.confidence > entry.bestConfidence
                )
            ) {
                entry.bestConfidence = candidate.confidence;
            }
        }

        function buildFullUtteranceCandidates(event) {
            if (!event || !event.results || !event.results.length) {
                return [];
            }

            let beams = [{ transcript: '', confidenceTotal: 0, confidenceCount: 0, rankPenalty: 0 }];
            let allFinal = true;
            let anyResult = false;

            for (let r = 0; r < event.results.length; r++) {
                const result = event.results[r];
                if (!result || !result.length) continue;

                anyResult = true;
                if (!result.isFinal) allFinal = false;

                const alts = [];
                for (let i = 0; i < result.length && i < MAX_ALTERNATIVES; i++) {
                    const alt = result[i];
                    const transcript = alt && alt.transcript ? alt.transcript.trim() : '';
                    if (!transcript) continue;
                    alts.push({
                        transcript,
                        confidence:
                            typeof alt.confidence === 'number'
                                ? alt.confidence
                                : null,
                        rank: i
                    });
                }

                if (!alts.length) continue;

                const next = [];
                for (const beam of beams) {
                    for (const alt of alts) {
                        const hasConfidence = typeof alt.confidence === 'number';
                        next.push({
                            transcript: `${beam.transcript} ${alt.transcript}`.trim(),
                            confidenceTotal: beam.confidenceTotal + (hasConfidence ? alt.confidence : 0),
                            confidenceCount: beam.confidenceCount + (hasConfidence ? 1 : 0),
                            rankPenalty: beam.rankPenalty + alt.rank
                        });
                    }
                }

                next.sort((a, b) => {
                    if (a.rankPenalty !== b.rankPenalty) {
                        return a.rankPenalty - b.rankPenalty;
                    }
                    const ac = a.confidenceCount ? a.confidenceTotal / a.confidenceCount : 0;
                    const bc = b.confidenceCount ? b.confidenceTotal / b.confidenceCount : 0;
                    return bc - ac;
                });

                beams = next.slice(0, MAX_UTTERANCE_CANDIDATES);
            }

            if (!anyResult) return [];

            return beams.map(beam => ({
                transcript: beam.transcript,
                confidence:
                    beam.confidenceCount
                        ? beam.confidenceTotal / beam.confidenceCount
                        : null,
                source: allFinal ? 'FULL_FINAL' : 'FULL_MIXED',
                isFinal: allFinal,
                isInterim: !allFinal
            }));
        }

        function captureRecognitionResult(session, event) {
            if (!session || session.finished || session.cancelled) return;

            const rawSnapshot = snapshotRecognitionResults(event);
            session.diag.rawResultEvents.push({
                elapsedMs: Math.round(performance.now() - session.createdAt),
                ...rawSnapshot
            });

            let hasFinal = false;
            let hasInterim = false;

            for (const resultItem of rawSnapshot.results) {
                if (resultItem.isFinal) hasFinal = true;
                else hasInterim = true;

                for (const alt of resultItem.alternatives) {
                    addCandidate(session, {
                        transcript: alt.transcript,
                        confidence: alt.confidence,
                        source: resultItem.isFinal ? 'FINAL_SEGMENT' : 'INTERIM_SEGMENT',
                        isFinal: resultItem.isFinal,
                        isInterim: !resultItem.isFinal
                    });
                }
            }

            const fullCandidates = buildFullUtteranceCandidates(event);
            fullCandidates.forEach(candidate => addCandidate(session, candidate));

            addDiagEvent(
                session,
                hasFinal ? (hasInterim ? 'result(mixed)' : 'result(final)') : 'result(interim)',
                {
                    resultIndex: rawSnapshot.resultIndex,
                    resultCount: rawSnapshot.results.length,
                    candidatePoolSize: session.candidateMap.size
                }
            );

            renderLiveDiagnostic(session);
        }

        function evaluateSessionCandidates(session) {
            const rows = [];

            for (const entry of session.candidateMap.values()) {
                const evaluation = evaluateTranscript(
                    entry.transcript,
                    session.targetPokemon
                );

                rows.push({
                    ...evaluation,
                    sources: Array.from(entry.sources),
                    seenCount: entry.seenCount,
                    finalSeen: entry.finalSeen,
                    interimSeen: entry.interimSeen,
                    confidence: entry.bestConfidence,
                    firstSeenMs: entry.firstSeenMs,
                    lastSeenMs: entry.lastSeenMs
                });
            }

            rows.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                if (Number(b.exactTextMatch) !== Number(a.exactTextMatch)) {
                    return Number(b.exactTextMatch) - Number(a.exactTextMatch);
                }
                if (Number(b.exactZhuyinMatch) !== Number(a.exactZhuyinMatch)) {
                    return Number(b.exactZhuyinMatch) - Number(a.exactZhuyinMatch);
                }
                if (Number(b.finalSeen) !== Number(a.finalSeen)) {
                    return Number(b.finalSeen) - Number(a.finalSeen);
                }
                if (b.seenCount !== a.seenCount) return b.seenCount - a.seenCount;
                return (b.confidence || 0) - (a.confidence || 0);
            });

            return rows;
        }

        function selectSessionEvidence(session, evaluations) {
            if (!evaluations.length) {
                return {
                    selected: null,
                    reason: 'NO_CANDIDATE'
                };
            }

            const exactStrong = evaluations.find(item =>
                (item.exactTextMatch || item.exactZhuyinMatch) &&
                (item.finalSeen || item.seenCount >= 2)
            );

            if (exactStrong) {
                return {
                    selected: exactStrong,
                    reason: exactStrong.exactTextMatch
                        ? 'EXACT_TEXT_CONFIRMED'
                        : 'EXACT_ZHUYIN_CONFIRMED'
                };
            }

            const bestFinal = evaluations.find(item => item.finalSeen) || null;
            if (bestFinal && bestFinal.score >= SCORE_CORRECT) {
                return {
                    selected: bestFinal,
                    reason: 'BEST_FINAL_OVER_THRESHOLD'
                };
            }

            const best = evaluations[0];
            const stableHighCandidate =
                best.score >= SCORE_CORRECT &&
                (
                    best.seenCount >= 2 ||
                    (bestFinal && bestFinal.score >= SCORE_CLOSE)
                );

            if (stableHighCandidate) {
                return {
                    selected: best,
                    reason: 'SESSION_POOL_HIGH_CONFIDENCE'
                };
            }

            return {
                selected: bestFinal || best,
                reason: bestFinal ? 'BEST_FINAL_BELOW_THRESHOLD' : 'BEST_AVAILABLE_BELOW_THRESHOLD'
            };
        }

        function inferDiagnosticCategory(session, selected, evaluations) {
            if (session.diag.lastError) {
                return `BROWSER_ERROR:${session.diag.lastError}`;
            }

            if (!pinyinFn) {
                return 'PINYIN_PRO_NOT_LOADED';
            }

            if (!evaluations.length || !selected) {
                return session.speechStarted
                    ? 'NO_ASR_RESULT_AFTER_SPEECH'
                    : 'NO_SPEECH_DETECTED';
            }

            const targetLength = getTargetZhuyin(session.targetPokemon).length;
            const spokenLength = selected.bestWindow ? selected.bestWindow.length : 0;

            if (selected.score >= SCORE_CORRECT) {
                return 'SUCCESS';
            }

            if (targetLength >= 2 && spokenLength > 0 && spokenLength < targetLength) {
                return 'POSSIBLE_TRUNCATION_OR_PARTIAL_TRANSCRIPT';
            }

            if (selected.score >= SCORE_CLOSE) {
                return 'NEAR_MISS_SCORING_OR_ASR_ONE_SOUND_OFF';
            }

            if (selected.score < 50) {
                return 'ASR_TRANSCRIPT_FAR_FROM_TARGET';
            }

            return 'ASR_OR_SCORING_MISMATCH';
        }

        function applyFinalDecision(session, selected, reason, evaluations, finalizeReason) {
            if (!session || session.resultHandled || session.cancelled) return false;

            session.resultHandled = true;
            session.userMessageHandled = true;
            session.resultSource = reason;
            session.diag.finalizeReason = finalizeReason;

            const category = inferDiagnosticCategory(session, selected, evaluations);
            session.diag.diagnosticCategory = category;

            if (!selected) {
                setStatus('⏸️ 有收到錄音流程，但沒有可判斷的語音文字。請再試一次。', 'retry');
                session.diag.decision = {
                    outcome: 'NO_RESULT',
                    reason,
                    category
                };
                return true;
            }

            const success =
                currentPokemon === session.targetPokemon &&
                selected.score >= SCORE_CORRECT;

            let outcome = 'RETRY';
            if (success) {
                outcome = 'SUCCESS';
                setStatus(`🎉 太棒了！答案是「${session.targetPokemon.name}」！`, 'success');
                revealAnswer();
            } else if (selected.score >= SCORE_CLOSE) {
                outcome = 'CLOSE';
                setStatus('😊 差一點點，再試一次！', 'close');
            } else {
                setStatus(
                    isReadingMode
                        ? '💪 糟糕，再試著唸一次唷！'
                        : '💪 糟糕，再試著拼一次唷！',
                    'retry'
                );
            }

            session.diag.decision = {
                outcome,
                reason,
                category,
                transcript: selected.transcript,
                score: selected.score,
                rawScore: selected.rawScore,
                matchType: selected.matchType,
                spokenZhuyin: selected.spokenZhuyin,
                bestWindow: selected.bestWindow,
                targetZhuyin: selected.targetZhuyin,
                sources: selected.sources,
                seenCount: selected.seenCount,
                finalSeen: selected.finalSeen,
                confidence: selected.confidence
            };

            return true;
        }

        function finalizeRecognitionDecision(session, reason = 'session finalize') {
            if (!session || session.resultHandled || session.cancelled) {
                return false;
            }

            const evaluations = evaluateSessionCandidates(session);
            session.diag.evaluations = evaluations.slice(0, 20).map(item => ({
                transcript: item.transcript,
                score: item.score,
                rawScore: item.rawScore,
                matchType: item.matchType,
                cleanText: item.cleanText,
                spokenZhuyin: item.spokenZhuyin,
                bestWindow: item.bestWindow,
                targetZhuyin: item.targetZhuyin,
                exactTextMatch: item.exactTextMatch,
                exactZhuyinMatch: item.exactZhuyinMatch,
                phoneticRescue: item.phoneticRescue,
                sources: item.sources,
                seenCount: item.seenCount,
                finalSeen: item.finalSeen,
                interimSeen: item.interimSeen,
                confidence: round3(item.confidence),
                firstSeenMs: item.firstSeenMs,
                lastSeenMs: item.lastSeenMs
            }));

            const selection = selectSessionEvidence(session, evaluations);

            addDiagEvent(session, 'FINALIZE_DECISION', {
                reason,
                candidateCount: evaluations.length,
                selectedTranscript: selection.selected ? selection.selected.transcript : '',
                selectedScore: selection.selected ? selection.selected.score : null,
                selectionReason: selection.reason
            });

            return applyFinalDecision(
                session,
                selection.selected,
                selection.reason,
                evaluations,
                reason
            );
        }


        /*
         * V16 Fast Decision
         * -----------------
         * 收到 result 後立即評估目前整個 candidate pool，
         * 只有「證據已經足夠強」才提早結束。
         * 模糊答案不會被強制提前判錯。
         */
        function getBestFinalEvaluation(session) {
            const evaluations = evaluateSessionCandidates(session);
            const bestFinal = evaluations.find(item => item.finalSeen) || null;
            return { evaluations, bestFinal };
        }

        function finishFastSuccess(session, reason) {
            if (
                !session ||
                session.finished ||
                session.cancelled ||
                session.resultHandled
            ) {
                return false;
            }

            const applied = finalizeRecognitionDecision(session, reason);

            if (applied) {
                addDiagEvent(session, 'FAST_DECISION_SUCCESS', { reason });
                requestStop(session, reason, false);
            }

            return applied;
        }

        function scheduleFastDecision(session, delayMs, reason, mode = 'success') {
            if (!session || session.finished || session.cancelled || session.resultHandled) {
                return;
            }

            clearTimeout(session.earlyDecisionTimer);

            session.earlyDecisionTimer = setTimeout(() => {
                if (
                    session.finished ||
                    session.cancelled ||
                    session.resultHandled
                ) {
                    return;
                }

                const { evaluations, bestFinal } = getBestFinalEvaluation(session);

                if (!bestFinal) {
                    return;
                }

                if (mode === 'success') {
                    if (bestFinal.score >= SCORE_CORRECT) {
                        finishFastSuccess(session, reason);
                    }
                    return;
                }

                /*
                 * 分數不足時不直接判斷，只代表「使用者應該已經把答案講完」。
                 * 先 stop，真正判分仍走完整 session pool。
                 */
                const targetLength = getTargetZhuyin(session.targetPokemon).length;
                const spokenLength = Array.isArray(bestFinal.spokenZhuyin)
                    ? bestFinal.spokenZhuyin.length
                    : 0;

                if (
                    bestFinal.finalSeen &&
                    (
                        spokenLength >= targetLength ||
                        String(bestFinal.cleanText || '').length >= targetLength
                    )
                ) {
                    addDiagEvent(session, 'FAST_STOP_COMPLETE_FINAL', {
                        reason,
                        bestFinalTranscript: bestFinal.transcript,
                        bestFinalScore: bestFinal.score,
                        delayMs
                    });

                    requestStop(
                        session,
                        reason,
                        true
                    );
                }
            }, delayMs);
        }

        function considerFastDecision(session) {
            if (
                !session ||
                session.finished ||
                session.cancelled ||
                session.resultHandled ||
                session.stopRequested
            ) {
                return;
            }

            const { evaluations, bestFinal } = getBestFinalEvaluation(session);

            if (!bestFinal) {
                return;
            }

            /*
             * 最強證據：Final 已完全命中文字或注音。
             * 這種情況沒有必要再等剩餘收音時間。
             */
            if (
                bestFinal.exactTextMatch ||
                bestFinal.exactZhuyinMatch
            ) {
                clearTimeout(session.earlyDecisionTimer);

                addDiagEvent(session, 'FAST_DECISION_EXACT_FINAL', {
                    transcript: bestFinal.transcript,
                    score: bestFinal.score,
                    matchType: bestFinal.matchType
                });

                finishFastSuccess(
                    session,
                    bestFinal.exactTextMatch
                        ? 'fast exact-text final'
                        : 'fast exact-zhuyin final'
                );
                return;
            }

            /*
             * >= 90 的 Final 仍是成功證據，但不是 exact，
             * 留 250ms 看瀏覽器是否立刻修正結果。
             */
            if (bestFinal.score >= SCORE_CORRECT) {
                addDiagEvent(session, 'FAST_DECISION_HIGH_FINAL_PENDING', {
                    transcript: bestFinal.transcript,
                    score: bestFinal.score,
                    confirmMs: FAST_FINAL_CONFIRM_MS
                });

                scheduleFastDecision(
                    session,
                    FAST_FINAL_CONFIRM_MS,
                    'fast high-score final',
                    'success'
                );
                return;
            }

            /*
             * 已經有一個看起來完整的 Final，但未達成功門檻：
             * 不判錯，只再聽 900ms。
             * 若期間有新 result，onresult 會取消並重新評估。
             */
            const targetLength = getTargetZhuyin(session.targetPokemon).length;
            const spokenLength = Array.isArray(bestFinal.spokenZhuyin)
                ? bestFinal.spokenZhuyin.length
                : 0;

            if (
                spokenLength >= targetLength ||
                String(bestFinal.cleanText || '').length >= targetLength
            ) {
                addDiagEvent(session, 'FAST_STOP_LOW_FINAL_PENDING', {
                    transcript: bestFinal.transcript,
                    score: bestFinal.score,
                    settleMs: FINAL_BELOW_THRESHOLD_SETTLE_MS
                });

                scheduleFastDecision(
                    session,
                    FINAL_BELOW_THRESHOLD_SETTLE_MS,
                    'complete final settled below threshold',
                    'stop-only'
                );
            }
        }

        function formatDiagnosticRecord(record) {
            if (!record) return '尚無語音診斷紀錄。';

            const lines = [];
            const d = record.decision || {};

            lines.push(`=== V16 Speech Diagnostic | Session #${record.id} ===`);
            lines.push(`時間: ${record.startedAt || ''}`);
            lines.push(`題目: ${record.targetName || ''}`);
            lines.push(`標準注音: ${(record.targetZhuyin || []).join(' / ')}`);
            lines.push(`模式: ${record.mode || ''}`);
            lines.push(`結果: ${d.outcome || '未完成'}`);
            lines.push(`診斷分類: ${record.diagnosticCategory || d.category || ''}`);
            lines.push(`採用原因: ${d.reason || ''}`);
            lines.push(`結束原因: ${record.finalizeReason || record.stopReason || ''}`);
            lines.push(`採用文字: ${d.transcript || ''}`);
            lines.push(`採用注音: ${(d.spokenZhuyin || []).join(' / ')}`);
            lines.push(`最佳區段: ${(d.bestWindow || []).join(' / ')}`);
            lines.push(`分數: ${d.score ?? ''} (raw ${d.rawScore ?? ''})`);
            lines.push(`matchType: ${d.matchType || ''}`);
            lines.push(`來源: ${(d.sources || []).join(', ')}`);
            lines.push(`seenCount: ${d.seenCount ?? ''} | finalSeen: ${d.finalSeen ?? ''} | confidence: ${d.confidence ?? ''}`);
            lines.push('');
            lines.push('--- Environment ---');
            const env = record.environment || {};
            lines.push(`Speech API: ${env.speechApi || ''}`);
            lines.push(`pinyin-pro: ${env.pinyinProLoaded ? 'loaded' : 'NOT loaded'}`);
            lines.push(`pinyin source: ${env.pinyinLoadSource || ''}`);
            if (Array.isArray(env.pinyinLoadAttempts) && env.pinyinLoadAttempts.length) {
                lines.push(
                    `pinyin attempts: ${env.pinyinLoadAttempts.map(item =>
                        `${item.source}:${item.status}${item.extra ? `(${item.extra})` : ''}`
                    ).join(' | ')}`
                );
            }
            lines.push(`secureContext: ${env.secureContext}`);
            lines.push(`UA: ${env.userAgent || ''}`);
            lines.push('');
            lines.push('--- Raw Recognition Events ---');

            (record.rawResultEvents || []).forEach((evt, index) => {
                lines.push(`#${index + 1} +${evt.elapsedMs}ms resultIndex=${evt.resultIndex}`);
                (evt.results || []).forEach(result => {
                    lines.push(`  result[${result.index}] ${result.isFinal ? 'FINAL' : 'INTERIM'}`);
                    (result.alternatives || []).forEach(alt => {
                        lines.push(`    ${alt.rank}. "${alt.transcript}" confidence=${alt.confidence ?? ''}`);
                    });
                });
            });

            lines.push('');
            lines.push('--- Ranked Candidate Evaluations ---');
            (record.evaluations || []).forEach((item, index) => {
                lines.push(
                    `${index + 1}. "${item.transcript}" score=${item.score} raw=${item.rawScore} ` +
                    `type=${item.matchType} final=${item.finalSeen} seen=${item.seenCount} ` +
                    `confidence=${item.confidence ?? ''}`
                );
                lines.push(`   zhuyin: ${(item.spokenZhuyin || []).join(' / ')}`);
                lines.push(`   best:   ${(item.bestWindow || []).join(' / ')}`);
                lines.push(`   source: ${(item.sources || []).join(', ')}`);
            });

            lines.push('');
            lines.push('--- Event Timeline ---');
            (record.events || []).forEach(evt => {
                const rest = { ...evt };
                delete rest.seq;
                delete rest.elapsedMs;
                delete rest.type;
                const detail = Object.keys(rest).length ? ` ${JSON.stringify(rest)}` : '';
                lines.push(`${String(evt.seq).padStart(2, '0')}. +${evt.elapsedMs}ms ${evt.type}${detail}`);
            });

            return lines.join('\n');
        }

        function renderSavedDiagnostic(record) {
            if (!record) {
                diagnosticSummary.textContent = '尚未有語音測試紀錄。';
                diagnosticOutput.textContent = '按下麥克風測試後，這裡會顯示完整辨識流程。';
                return;
            }

            const d = record.decision || {};
            diagnosticSummary.textContent = [
                `Session #${record.id}｜${record.targetName}`,
                `結果：${d.outcome || '未完成'}｜診斷：${record.diagnosticCategory || d.category || '尚未分類'}`,
                `瀏覽器採用文字：${d.transcript || '（無）'}`,
                `分數：${d.score ?? '—'}｜結束原因：${record.finalizeReason || record.stopReason || '—'}`
            ].join('\n');

            diagnosticOutput.textContent = formatDiagnosticRecord(record);
        }

        function renderLiveDiagnostic(session) {
            if (!session || !session.diag) return;
            const rawEvents = session.diag.rawResultEvents || [];
            const latest = rawEvents[rawEvents.length - 1];
            let latestText = '';

            if (latest && latest.results) {
                const pieces = [];
                latest.results.forEach(result => {
                    const first = result.alternatives && result.alternatives[0];
                    if (first && first.transcript) pieces.push(first.transcript);
                });
                latestText = pieces.join(' / ');
            }

            diagnosticSummary.textContent = [
                `Session #${session.id}｜題目：${session.targetPokemon.name}`,
                `狀態：錄音/辨識中｜候選池：${session.candidateMap.size}`,
                `目前瀏覽器聽到：${latestText || '等待結果中...'}`
            ].join('\n');
        }

        function serializeSessionDiagnostic(session) {
            return {
                id: session.id,
                startedAt: session.diag.startedAt,
                finishedAt: nowIso(),
                targetName: session.targetPokemon.name,
                targetZhuyin: getTargetZhuyin(session.targetPokemon),
                mode: session.diag.mode,
                environment: session.diag.environment,
                recognitionConfig: session.diag.recognitionConfig,
                stopReason: session.stopReason || '',
                finalizeReason: session.diag.finalizeReason || '',
                diagnosticCategory: session.diag.diagnosticCategory || '',
                lastError: session.diag.lastError || '',
                decision: session.diag.decision || null,
                evaluations: session.diag.evaluations || [],
                rawResultEvents: session.diag.rawResultEvents || [],
                events: session.diag.events || []
            };
        }

        function persistFinishedSession(session) {
            if (!session || session.diagPersisted) return;
            session.diagPersisted = true;

            const record = serializeSessionDiagnostic(session);
            diagnosticHistory.push(record);
            diagnosticHistory = diagnosticHistory.slice(-DIAG_MAX_SESSIONS);
            saveDiagnosticHistory();
            renderSavedDiagnostic(record);
        }

        function finishSession(session, options = {}) {
            if (!session || session.finished) return;

            session.finished = true;
            clearSessionTimers(session);

            addDiagEvent(session, 'SESSION_FINISH', {
                speechStarted: session.speechStarted,
                audioEnded: session.audioEnded,
                serviceEnded: session.serviceEnded,
                stopRequested: session.stopRequested,
                stopReason: session.stopReason || '',
                abortRequested: session.abortRequested,
                resultHandled: session.resultHandled,
                resultSource: session.resultSource || '',
                candidatePoolSize: session.candidateMap.size
            });

            if (isCurrentSession(session)) {
                activeSession = null;
                setMicBusy(false);
            }

            if (
                !session.cancelled &&
                !session.resultHandled &&
                !session.userMessageHandled &&
                !options.keepStatus
            ) {
                setStatus('⏸️ 沒有收到可用的語音辨識結果，再試一次唷！', 'retry');
            }

            persistFinishedSession(session);
            session.recognition = null;
        }

        function forceAbortSession(session, reason = 'watchdog') {
            if (!session || session.finished || !session.recognition) return;

            if (!session.abortRequested) {
                session.abortRequested = true;
                addDiagEvent(session, 'abort()', { reason });

                try {
                    session.recognition.abort();
                } catch (error) {
                    addDiagEvent(session, 'abort() threw', { message: String(error) });
                }
            }

            clearTimeout(session.abortSettleTimer);
            session.abortSettleTimer = setTimeout(() => {
                if (!session.finished) {
                    if (!session.cancelled && !session.resultHandled) {
                        finalizeRecognitionDecision(session, `abort settle: ${reason}`);
                    }
                    finishSession(session, { keepStatus: true });
                }
            }, ABORT_SETTLE_MS);
        }

        function startHardSessionWatchdog(session) {
            clearTimeout(session.hardLimitTimer);
            session.hardLimitTimer = setTimeout(() => {
                if (session.finished) return;

                addDiagEvent(session, 'HARD_SESSION_LIMIT', {
                    limitMs: HARD_SESSION_LIMIT_MS
                });

                if (!session.resultHandled && !session.cancelled) {
                    finalizeRecognitionDecision(session, 'hard session limit');
                }

                forceAbortSession(session, 'hard session limit');
            }, HARD_SESSION_LIMIT_MS);
        }

        function startAudioStopWatchdog(session) {
            clearTimeout(session.audioStopWatchdogTimer);
            session.audioStopWatchdogTimer = setTimeout(() => {
                if (session.finished || session.audioEnded || session.serviceEnded) return;

                addDiagEvent(session, 'AUDIO_STOP_WATCHDOG', {
                    limitMs: AUDIO_STOP_WATCHDOG_MS
                });

                if (!session.resultHandled && !session.cancelled) {
                    finalizeRecognitionDecision(session, 'audio stop watchdog');
                }

                forceAbortSession(session, 'audio stop watchdog');
            }, AUDIO_STOP_WATCHDOG_MS);
        }

        function requestStop(session, reason = 'timer', updateMessage = true) {
            if (
                !session ||
                session.finished ||
                session.serviceEnded ||
                !session.recognition ||
                session.stopRequested
            ) {
                return;
            }

            session.stopRequested = true;
            session.stopReason = reason;
            clearTimeout(session.preSpeechTimer);
            clearTimeout(session.recordingTimer);
            clearTimeout(session.speechEndTimer);

            if (updateMessage && !session.cancelled) {
                setStatus('⏳ 已收到完整答案，正在做最後確認...');
                setMicBusy(true, '⏳ 判斷中...');
            }

            addDiagEvent(session, 'stop()', { reason });

            try {
                session.recognition.stop();
            } catch (error) {
                addDiagEvent(session, 'stop() threw', { message: String(error) });
                finalizeRecognitionDecision(session, 'stop() threw');
                forceAbortSession(session, 'stop() threw');
                return;
            }

            startAudioStopWatchdog(session);
        }

        function cancelActiveRecognition(reason = 'cancel', silent = false) {
            const session = activeSession;
            if (!session || session.finished) return;

            session.cancelled = true;
            session.userMessageHandled = true;
            session.stopReason = reason;
            addDiagEvent(session, 'CANCEL', { reason });
            forceAbortSession(session, reason);

            if (!silent) {
                setStatus('⏸️ 錄音已取消。', 'retry');
            }
        }

        function scheduleResultWaitAfterAudioEnd(session) {
            clearTimeout(session.resultWaitTimer);
            session.resultWaitTimer = setTimeout(() => {
                if (session.finished || session.resultHandled || session.cancelled) return;

                addDiagEvent(session, 'RESULT_WAIT_TIMEOUT', {
                    waitMs: RESULT_WAIT_AFTER_AUDIO_MS
                });

                finalizeRecognitionDecision(session, 'audioend result settle timeout');
                forceAbortSession(session, 'result settle complete');
            }, RESULT_WAIT_AFTER_AUDIO_MS);
        }

        function createRecognitionSession() {
            if (!SpeechRecognition || !currentPokemon) return null;

            const recognition = new SpeechRecognition();
            const session = {
                id: ++sessionSerial,
                recognition,
                createdAt: performance.now(),
                targetPokemon: currentPokemon,
                started: false,
                audioStarted: false,
                audioEnded: false,
                speechStarted: false,
                speechEnded: false,
                serviceEnded: false,
                stopRequested: false,
                stopReason: '',
                abortRequested: false,
                resultHandled: false,
                finalResultHandled: false,
                userMessageHandled: false,
                cancelled: false,
                finished: false,
                resultSource: '',
                candidateMap: new Map(),
                recordingLimitMs: getSpeechRecordingLimitMs(currentPokemon),
                preSpeechTimer: null,
                recordingTimer: null,
                speechEndTimer: null,
                audioStopWatchdogTimer: null,
                resultWaitTimer: null,
                endGraceTimer: null,
                hardLimitTimer: null,
                abortSettleTimer: null,
                earlyDecisionTimer: null,
                diagPersisted: false,
                diag: {
                    startedAt: nowIso(),
                    mode: isReadingMode ? 'reading' : 'bopomofo',
                    environment: getEnvironmentSnapshot(),
                    recognitionConfig: {},
                    rawResultEvents: [],
                    evaluations: [],
                    events: [],
                    decision: null,
                    diagnosticCategory: '',
                    finalizeReason: '',
                    lastError: ''
                }
            };

            recognition.lang = 'zh-TW';
            recognition.interimResults = true;
            recognition.maxAlternatives = MAX_ALTERNATIVES;

            /*
             * V16 保留 continuous=true：
             * continuous=true 讓慢速分段講話有機會繼續產生下一段結果。
             * 若瀏覽器實作不完整，事件紀錄也會把異常完整留下。
             */
            recognition.continuous = true;

            session.diag.recognitionConfig = {
                lang: recognition.lang,
                interimResults: recognition.interimResults,
                maxAlternatives: recognition.maxAlternatives,
                continuous: recognition.continuous,
                waitForSpeechMs: WAIT_FOR_SPEECH_MS,
                speechEndGraceMs: SPEECH_END_GRACE_MS,
                recordingLimitMs: session.recordingLimitMs,
                hardSessionLimitMs: HARD_SESSION_LIMIT_MS,
                fastFinalConfirmMs: FAST_FINAL_CONFIRM_MS,
                finalBelowThresholdSettleMs: FINAL_BELOW_THRESHOLD_SETTLE_MS
            };

            recognition.onstart = () => {
                if (!isCurrentSession(session) || session.cancelled) return;

                session.started = true;
                addDiagEvent(session, 'start', {
                    continuous: recognition.continuous,
                    lang: recognition.lang
                });

                setStatus('👂 麥克風已開啟，請正常把完整答案說完');
                setMicBusy(true, '⏹️ 錄音中...');

                clearTimeout(session.preSpeechTimer);
                session.preSpeechTimer = setTimeout(() => {
                    if (!session.speechStarted && !session.finished) {
                        session.userMessageHandled = true;
                        session.diag.diagnosticCategory = 'NO_SPEECH_DETECTED';
                        setStatus('👂 還沒有聽到說話聲，再試一次唷！', 'retry');
                        requestStop(session, '等待說話逾時', false);
                    }
                }, WAIT_FOR_SPEECH_MS);

                startHardSessionWatchdog(session);
            };

            recognition.onaudiostart = () => {
                session.audioStarted = true;
                addDiagEvent(session, 'audiostart');
            };

            recognition.onsoundstart = () => {
                addDiagEvent(session, 'soundstart');
                clearTimeout(session.speechEndTimer);
            };

            recognition.onsoundend = () => {
                addDiagEvent(session, 'soundend');
            };

            recognition.onspeechstart = () => {
                const firstSpeechStart = !session.speechStarted;
                session.speechStarted = true;
                session.speechEnded = false;
                addDiagEvent(session, 'speechstart', { firstSpeechStart });

                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.speechEndTimer);

                /* 只在第一次真正說話時啟動整題最大說話時間。 */
                if (firstSpeechStart) {
                    clearTimeout(session.recordingTimer);
                    session.recordingTimer = setTimeout(() => {
                        requestStop(
                            session,
                            `speechstart 後 ${session.recordingLimitMs}ms 最大收音窗`,
                            true
                        );
                    }, session.recordingLimitMs);
                }

                if (isCurrentSession(session) && !session.cancelled) {
                    setStatus('🎙️ 正在收音，請把完整答案說完');
                }
            };

            recognition.onspeechend = () => {
                session.speechEnded = true;
                addDiagEvent(session, 'speechend', {
                    quietGraceMs: SPEECH_END_GRACE_MS
                });

                if (isCurrentSession(session) && !session.cancelled) {
                    setStatus(`⏳ 偵測到停頓，保留 ${SPEECH_END_GRACE_MS / 1000} 秒等待後續語音...`);
                }

                /*
                 * V16：靜音窗縮短為 1.5 秒。
                 * 若期間 Safari 又送 soundstart / speechstart，倒數仍會被取消。
                 */
                clearTimeout(session.speechEndTimer);
                session.speechEndTimer = setTimeout(() => {
                    if (!session.finished && !session.cancelled && !session.stopRequested) {
                        requestStop(session, 'speechend 後靜音窗結束', true);
                    }
                }, SPEECH_END_GRACE_MS);
            };

            recognition.onaudioend = () => {
                session.audioEnded = true;
                addDiagEvent(session, 'audioend');

                clearTimeout(session.audioStopWatchdogTimer);
                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.recordingTimer);
                clearTimeout(session.speechEndTimer);

                if (!session.resultHandled && !session.cancelled) {
                    setStatus('⏳ 收音完成，正在做最後確認...');
                    scheduleResultWaitAfterAudioEnd(session);
                }
            };

            recognition.onresult = event => {
                /*
                 * 每次有新結果，先取消前一次的早停倒數。
                 * 代表瀏覽器還在更新辨識內容，應以最新候選重新評估。
                 */
                clearTimeout(session.earlyDecisionTimer);

                captureRecognitionResult(session, event);

                if (!isCurrentSession(session) || session.cancelled) {
                    return;
                }

                considerFastDecision(session);

                if (!session.resultHandled && !session.stopRequested) {
                    setStatus('🎙️ 已收到辨識結果，正在確認是否可以立即判斷...');
                }
            };

            recognition.onnomatch = () => {
                addDiagEvent(session, 'nomatch');
                if (!isCurrentSession(session) || session.cancelled) return;

                session.diag.diagnosticCategory = 'BROWSER_NOMATCH';
                requestStop(session, 'nomatch', true);
            };

            recognition.onerror = event => {
                const errorName = event && event.error ? event.error : 'unknown';
                session.diag.lastError = errorName;
                addDiagEvent(session, 'error', {
                    error: errorName,
                    message: event && event.message ? event.message : ''
                });

                if (!isCurrentSession(session) || session.cancelled) return;
                if (errorName === 'aborted' && session.abortRequested) return;

                if (
                    errorName === 'not-allowed' ||
                    errorName === 'service-not-allowed'
                ) {
                    session.userMessageHandled = true;
                    setStatus('🎤 請允許瀏覽器使用麥克風後再試一次。', 'error');
                } else if (errorName === 'audio-capture') {
                    session.userMessageHandled = true;
                    setStatus('🎤 找不到可用的麥克風，請檢查裝置設定。', 'error');
                } else if (errorName === 'network') {
                    session.userMessageHandled = true;
                    setStatus('🌐 語音服務連線失敗。這次診斷紀錄會保留下來。', 'error');
                }

                if (!session.resultHandled && session.candidateMap.size) {
                    finalizeRecognitionDecision(session, `error: ${errorName}`);
                }

                if (errorName !== 'aborted') {
                    forceAbortSession(session, `error: ${errorName}`);
                }
            };

            recognition.onend = () => {
                session.serviceEnded = true;
                addDiagEvent(session, 'end');

                clearTimeout(session.audioStopWatchdogTimer);
                clearTimeout(session.resultWaitTimer);
                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.recordingTimer);
                clearTimeout(session.speechEndTimer);

                if (!isCurrentSession(session)) {
                    clearSessionTimers(session);
                    return;
                }

                if (session.cancelled) {
                    finishSession(session, { keepStatus: true });
                    return;
                }

                /*
                 * Safari 偶爾 onend 與最後 result 的順序會很接近。
                 * 再保留短暫 settle window，之後才做「整個 session」最終判斷。
                 */
                clearTimeout(session.endGraceTimer);
                session.endGraceTimer = setTimeout(() => {
                    if (session.finished) return;

                    if (!session.resultHandled) {
                        finalizeRecognitionDecision(session, 'recognition onend settle');
                    }

                    finishSession(session, { keepStatus: true });
                }, END_RESULT_GRACE_MS);
            };

            return session;
        }

        function startRecognition() {
            if (!SpeechRecognition || !currentPokemon) return;

            if (typeof pinyinFn !== 'function') {
                setStatus(
                    '❌ 注音判分模組目前不可用，已停止本次錄音，避免誤判。',
                    'error'
                );
                micBtn.disabled = true;
                micBtn.textContent = '⚠️ 判分模組未載入';
                return;
            }

            if (activeSession && !activeSession.finished) return;

            const session = createRecognitionSession();
            if (!session) return;

            activeSession = session;
            setStatus('🎤 麥克風準備中...');
            setMicBusy(true, '🎤 準備中...');

            addDiagEvent(session, 'SESSION_CREATE', {
                target: session.targetPokemon.name,
                targetZhuyin: getTargetZhuyin(session.targetPokemon),
                pinyinProLoaded: Boolean(pinyinFn),
                recognitionConfig: session.diag.recognitionConfig
            });

            renderLiveDiagnostic(session);

            try {
                session.recognition.start();
            } catch (error) {
                session.diag.lastError = 'start-threw';
                addDiagEvent(session, 'start() threw', {
                    message: String(error)
                });
                session.userMessageHandled = true;
                setStatus('🎤 麥克風還沒準備好，請再按一次。', 'retry');
                finishSession(session, { keepStatus: true });
            }
        }

        async function copyDiagnosticText(textToCopy, successMessage) {
            if (!textToCopy) return;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textToCopy);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = textToCopy;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                }
                setStatus(successMessage || '📋 已複製語音診斷紀錄。', 'success');
            } catch (error) {
                console.warn('複製診斷紀錄失敗：', error);
                setStatus('📋 無法自動複製，請直接選取診斷區文字。', 'retry');
            }
        }

        copyLatestDiagBtn.addEventListener('click', () => {
            const latest = diagnosticHistory[diagnosticHistory.length - 1];
            copyDiagnosticText(
                formatDiagnosticRecord(latest),
                '📋 已複製最新一題的完整語音紀錄。'
            );
        });

        copyAllDiagBtn.addEventListener('click', () => {
            const allText = diagnosticHistory.length
                ? diagnosticHistory.map(formatDiagnosticRecord).join('\n\n\n')
                : '尚無語音診斷紀錄。';
            copyDiagnosticText(
                allText,
                `📋 已複製 ${diagnosticHistory.length} 筆語音診斷紀錄。`
            );
        });

        clearDiagBtn.addEventListener('click', () => {
            diagnosticHistory = [];
            saveDiagnosticHistory();
            renderSavedDiagnostic(null);
            setStatus('🧹 語音診斷紀錄已清除。');
        });

        /* 重新整理頁面後仍顯示上一次測試。 */
        renderSavedDiagnostic(diagnosticHistory[diagnosticHistory.length - 1] || null);

        /* =========================================================
         * 按鈕
         * ========================================================= */

        modeBtn.addEventListener('click', () => {
            if (isChangingQuestion) return;

            pendingMicStart = false;
            isReadingMode = !isReadingMode;
            modeBtn.textContent = isReadingMode
                ? '切換為：拼音模式'
                : '切換為：認字模式';
            loadRandomPokemon();
        });

        micBtn.addEventListener('click', () => {
            if (isChangingQuestion) {
                pendingMicStart = true;
                setStatus('⏳ 正在換題，完成後會自動開啟麥克風...');
                return;
            }

            startRecognition();
        });

        showBtn.addEventListener('click', () => {
            if (isChangingQuestion || !currentPokemon) return;

            pendingMicStart = false;
            cancelActiveRecognition('查看答案', true);
            revealAnswer();
            setStatus(`答案是：${currentPokemon.name}`);
        });

        nextBtn.addEventListener('click', () => {
            if (isChangingQuestion) return;

            pendingMicStart = false;
            loadRandomPokemon();
        });

        /* =========================================================
         * iPad / iPhone Safari 背景切換保護
         * ========================================================= */

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && activeSession && !activeSession.finished) {
                activeSession.cancelled = true;
                activeSession.userMessageHandled = true;
                forceAbortSession(activeSession, 'visibilitychange');
            }
        });

        window.addEventListener('pagehide', () => {
            if (activeSession && !activeSession.finished) {
                activeSession.cancelled = true;
                activeSession.userMessageHandled = true;
                forceAbortSession(activeSession, 'pagehide');
            }
        });
    </script>
</body>
</html>
