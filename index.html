                        : '請拼出上面的注音'
                );
            }
        });

        /* =========================================================
         * 畫面 / 題目
         * ========================================================= */

        function generateZhuyinHTML(name, zhuyinArray) {
            let html = '';
            const chars = Array.from(String(name || ''));

            for (let i = 0; i < chars.length; i++) {
                const char = chars[i];
                const bpmf = zhuyinArray[i] || '';

                /*
                 * ：、・、．等符號只顯示名稱本身。
                 * 不建立 zhuyin-col，因此不會再看到「大冒號旁邊一個小冒號」。
                 */
                if (isSilentNameSymbol(char)) {
                    html += `
                        <div class="char-block symbol-only" aria-hidden="true">
                            <div class="char-text">${escapeHtml(char)}</div>
                        </div>
                    `;
                    continue;
                }

                /*
                 * Ｑ、Ｚ、Ⅱ 等特殊名稱字元目前保留官方顯示，
                 * 但 dataset 中並不是注音，因此不硬畫成「注音」。
                 */
                if (!isRealZhuyin(bpmf)) {
                    html += `
                        <div class="char-block symbol-only">
                            <div class="char-text">${escapeHtml(char)}</div>
                        </div>
                    `;
                    continue;
                }

                let tone = '';
                let lightTone = '';
                let mainBpmf = bpmf;

                if (bpmf.startsWith('˙')) {
                    lightTone = '˙';
                    mainBpmf = bpmf.substring(1);
                } else if (bpmf.endsWith('˙')) {
                    lightTone = '˙';
                    mainBpmf = bpmf.slice(0, -1);
                } else if (['ˊ', 'ˇ', 'ˋ'].includes(bpmf.slice(-1))) {
                    tone = bpmf.slice(-1);
                    mainBpmf = bpmf.slice(0, -1);
                }

                const bpmfSpans = mainBpmf
                    .split('')
                    .map(b => `<span>${escapeHtml(b)}</span>`)
                    .join('');

                html += `
                    <div class="char-block">
                        <div class="char-text">${escapeHtml(char)}</div>
                        <div class="zhuyin-col">
                            ${lightTone ? `<div class="tone-light">${lightTone}</div>` : ''}
                            <div class="bpmf-stack">${bpmfSpans}</div>
                            ${tone ? `<div class="tone-side">${tone}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function revealAnswer() {
            card.classList.add('flipped');
            bopomofoText.classList.remove('hide-zhuyin');
        }

        function applyPokemonQuestion(nextPokemon) {
            currentPokemon = nextPokemon;

            if (isReadingMode) {
                bopomofoText.classList.add('hide-zhuyin');
                setStatus('請唸出上面的國字');
            } else {
                bopomofoText.classList.remove('hide-zhuyin');
                setStatus('請拼出上面的注音');
            }

            bopomofoText.innerHTML = generateZhuyinHTML(
                currentPokemon.name,
                currentPokemon.zhuyin
            );

            /*
             * 只有在卡牌已經回到背面後才更換正面圖片。
             * 這樣答案翻開時按「下一題」，不會在翻回去的途中閃出下一隻。
             */
            pokemonImage.src = currentPokemon.image;
            pokemonImage.alt = currentPokemon.name;

            /* 順便預載再下一題的圖片。 */
            preloadUpcomingImage();
        }

        function loadRandomPokemon() {
            if (typeof pokemonDB === 'undefined' || pokemonDB.length === 0) {
                return;
            }

            if (isChangingQuestion) {
                return;
            }

            cancelActiveRecognition('換題 / 切換模式', true);

            const nextPokemon = drawNextPokemon();
            const wasFlipped = card.classList.contains('flipped');

            /*
             * 如果卡牌本來就在背面，直接換題即可。
             */
            if (!wasFlipped) {
                card.classList.remove('flipped');
                applyPokemonQuestion(nextPokemon);
                return;
            }

            /*
             * 如果目前答案是翻開的：
             * 1. 保留「舊題」圖片
             * 2. 先把卡牌完整翻回背面
             * 3. transform 動畫結束後才換成下一題
             *
             * Safari 偶爾可能漏掉 transitionend，因此另外加 950ms fallback。
             */
            isChangingQuestion = true;

            let finished = false;
            let fallbackTimer = null;

            const finishQuestionChange = () => {
                if (finished) return;
                finished = true;

                if (fallbackTimer) {
                    clearTimeout(fallbackTimer);
                    fallbackTimer = null;
                }

                card.removeEventListener('transitionend', onCardTransitionEnd);

                applyPokemonQuestion(nextPokemon);
                isChangingQuestion = false;

                /*
                 * 使用者在翻牌期間按過麥克風：現在題目已安全切換完成，
                 * 自動執行那次錄音要求。
                 */
                if (pendingMicStart) {
                    pendingMicStart = false;
                    setTimeout(() => {
                        if (!isChangingQuestion) {
                            startRecognition();
                        }
                    }, 0);
                }
            };

            const onCardTransitionEnd = (event) => {
                if (event.target !== card || event.propertyName !== 'transform') {
                    return;
                }

                finishQuestionChange();
            };

            card.addEventListener('transitionend', onCardTransitionEnd);
            card.classList.remove('flipped');

            fallbackTimer = setTimeout(
                finishQuestionChange,
                950
            );
        }

        /* =========================================================
         * 注音 / 拼音正規化
         * ========================================================= */

        function normalizeZhuyinSyllable(value) {
            return String(value || '')
                .replace(/[ˊˇˋ˙ˉ]/g, '')
                .replace(/\s+/g, '')
                .trim();
        }

        function getTargetZhuyin(pokemon) {
            if (!pokemon || !Array.isArray(pokemon.zhuyin)) {
                return [];
            }

            const chars = Array.from(String(pokemon.name || ''));

            return pokemon.zhuyin
                .map((value, index) => {
                    const char = chars[index] || '';

                    /* ：、・等無聲符號完全不參與發音答案。 */
                    if (isSilentNameSymbol(char)) {
                        return '';
                    }

                    const normalized = normalizeZhuyinSyllable(value);

                    /*
                     * Ｑ、Ｚ、Ⅱ 等不是注音字串：保留名稱顯示，但不讓它們
                     * 被錯當成一個注音音節，避免莫名拉低相似度。
                     */
                    return /[ㄅ-ㄩ]/.test(normalized) ? normalized : '';
                })
                .filter(Boolean);
        }

        /*
         * 將 pinyin-pro 產生的無聲調拼音，轉成無聲調注音。
         *
         * 這樣「標準答案」完全來自 dataset.js 的 zhuyin，
         * 不再讓 pinyin-pro 重新猜寶可夢名稱的讀音。
         */
        function pinyinSyllableToZhuyin(rawSyllable) {
            let syllable = String(rawSyllable || '')
                .toLowerCase()
                .replace(/u:/g, 'v')
                .replace(/ü/g, 'v')
                .replace(/[^a-zv]/g, '');

            if (!syllable) {
                return '';
            }

            const zeroInitialMap = {
                yi: 'ㄧ',
                ya: 'ㄧㄚ',
                yo: 'ㄧㄛ',
                ye: 'ㄧㄝ',
                yai: 'ㄧㄞ',
                yao: 'ㄧㄠ',
                you: 'ㄧㄡ',
                yan: 'ㄧㄢ',
                yin: 'ㄧㄣ',
                yang: 'ㄧㄤ',
                ying: 'ㄧㄥ',
                yong: 'ㄩㄥ',
                yu: 'ㄩ',
                yue: 'ㄩㄝ',
                yuan: 'ㄩㄢ',
                yun: 'ㄩㄣ',
                wu: 'ㄨ',
                wa: 'ㄨㄚ',
                wo: 'ㄨㄛ',
                wai: 'ㄨㄞ',
                wei: 'ㄨㄟ',
                wan: 'ㄨㄢ',
                wen: 'ㄨㄣ',
                wang: 'ㄨㄤ',
                weng: 'ㄨㄥ'
            };

            if (zeroInitialMap[syllable]) {
                return zeroInitialMap[syllable];
            }

            const initialMap = {
                zh: 'ㄓ',
                ch: 'ㄔ',
                sh: 'ㄕ',
                b: 'ㄅ',
                p: 'ㄆ',
                m: 'ㄇ',
                f: 'ㄈ',
                d: 'ㄉ',
                t: 'ㄊ',
                n: 'ㄋ',
                l: 'ㄌ',
                g: 'ㄍ',
                k: 'ㄎ',
                h: 'ㄏ',
                j: 'ㄐ',
                q: 'ㄑ',
                x: 'ㄒ',
                r: 'ㄖ',
                z: 'ㄗ',
                c: 'ㄘ',
                s: 'ㄙ'
            };

            const finalMap = {
                a: 'ㄚ',
                o: 'ㄛ',
                e: 'ㄜ',
                ai: 'ㄞ',
                ei: 'ㄟ',
                ao: 'ㄠ',
                ou: 'ㄡ',
                an: 'ㄢ',
                en: 'ㄣ',
                ang: 'ㄤ',
                eng: 'ㄥ',
                er: 'ㄦ',

                i: 'ㄧ',
                ia: 'ㄧㄚ',
                ie: 'ㄧㄝ',
                iao: 'ㄧㄠ',
                iu: 'ㄧㄡ',
                iou: 'ㄧㄡ',
                ian: 'ㄧㄢ',
                in: 'ㄧㄣ',
                iang: 'ㄧㄤ',
                ing: 'ㄧㄥ',
                iong: 'ㄩㄥ',

                u: 'ㄨ',
                ua: 'ㄨㄚ',
                uo: 'ㄨㄛ',
                uai: 'ㄨㄞ',
                ui: 'ㄨㄟ',
                uei: 'ㄨㄟ',
                uan: 'ㄨㄢ',
                un: 'ㄨㄣ',
                uen: 'ㄨㄣ',
                uang: 'ㄨㄤ',
                ong: 'ㄨㄥ',
                ueng: 'ㄨㄥ',

                v: 'ㄩ',
                ve: 'ㄩㄝ',
                van: 'ㄩㄢ',
                vn: 'ㄩㄣ'
            };

            let initial = '';
            let rest = syllable;

            for (const candidate of ['zh', 'ch', 'sh']) {
                if (syllable.startsWith(candidate)) {
                    initial = candidate;
                    rest = syllable.slice(candidate.length);
                    break;
                }
            }

            if (!initial && initialMap[syllable[0]]) {
                initial = syllable[0];
                rest = syllable.slice(1);
            }

            /* ㄓ ㄔ ㄕ ㄖ ㄗ ㄘ ㄙ 的「i」不另外寫 ㄧ */
            if (
                rest === 'i' &&
                ['zh', 'ch', 'sh', 'r', 'z', 'c', 's'].includes(initial)
            ) {
                return initialMap[initial] || '';
            }

            /* ju / qu / xu 的 u 實際代表 ㄩ */
            if (['j', 'q', 'x'].includes(initial)) {
                if (rest === 'u') rest = 'v';
                else if (rest === 'ue') rest = 've';
                else if (rest === 'uan') rest = 'van';
                else if (rest === 'un') rest = 'vn';
            }

            const initialZhuyin = initialMap[initial] || '';
            const finalZhuyin = finalMap[rest] || '';

            if (!initial && finalZhuyin) {
                return finalZhuyin;
            }

            if (initialZhuyin && (finalZhuyin || rest === '')) {
                return initialZhuyin + finalZhuyin;
            }

            console.warn('無法轉換拼音音節：', rawSyllable);
            return '';
        }

        function normalizeNameForComparison(text) {
            return String(text || '')
                .normalize('NFKC')
                .replace(/[：:・．.·•‧\s]/g, '')
                .replace(/[^\u3400-\u9fffA-Za-z0-9üÜ]/g, '')
                .toLowerCase()
                .trim();
        }

        function cleanRecognizedText(text) {
            return normalizeNameForComparison(text);
        }

        function recognizedTextToZhuyin(text) {
            if (!pinyinFn || !text) {
                return [];
            }

            try {
                const pinyinArray = pinyinFn(text, {
                    toneType: 'none',
                    type: 'array',
                    /* Q / Z / 數字等非中文字不轉成假注音。 */
                    nonZh: 'removed'
                });

                return pinyinArray
                    .map(item => pinyinSyllableToZhuyin(item))
                    .filter(Boolean);
            } catch (error) {
                console.warn('辨識文字轉注音失敗：', error);
                return [];
            }
        }

        /* =========================================================
         * 相似度
         * ========================================================= */

        function levenshteinDistance(a, b) {
            a = String(a || '');
            b = String(b || '');

            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;

            const previous = new Array(b.length + 1);
            const current = new Array(b.length + 1);

            for (let j = 0; j <= b.length; j++) {
                previous[j] = j;
            }

            for (let i = 1; i <= a.length; i++) {
                current[0] = i;

                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;

                    current[j] = Math.min(
                        current[j - 1] + 1,
                        previous[j] + 1,
                        previous[j - 1] + cost
                    );
                }

                for (let j = 0; j <= b.length; j++) {
                    previous[j] = current[j];
                }
            }

            return previous[b.length];
        }

        function stringSimilarity(a, b) {
            a = String(a || '');
            b = String(b || '');

            if (!a && !b) return 100;
            if (!a || !b) return 0;
            if (a === b) return 100;

            const maxLength = Math.max(a.length, b.length);
            const distance = levenshteinDistance(a, b);

            return Math.max(0, (1 - distance / maxLength) * 100);
        }

        /*
         * 注音音節拆解：
         * 聲母只有第一個符號；其餘視為韻母/介音組合。
         * 這裡不處理聲調，因為 normalizeZhuyinSyllable() 已經移除聲調。
         */
        const ZHUYIN_INITIALS = new Set([
            'ㄅ', 'ㄆ', 'ㄇ', 'ㄈ',
            'ㄉ', 'ㄊ', 'ㄋ', 'ㄌ',
            'ㄍ', 'ㄎ', 'ㄏ',
            'ㄐ', 'ㄑ', 'ㄒ',
            'ㄓ', 'ㄔ', 'ㄕ', 'ㄖ',
            'ㄗ', 'ㄘ', 'ㄙ'
        ]);

        /*
         * 只列「語音辨識服務很常互相轉寫」的近音。
         * 這不是把它們當作完全相同；只有在長名稱且只錯這一個音節時才可能救援。
         */
        const CLOSE_INITIAL_GROUPS = [
            new Set(['ㄓ', 'ㄗ']),
            new Set(['ㄔ', 'ㄘ']),
            new Set(['ㄕ', 'ㄙ']),
            new Set(['ㄋ', 'ㄌ']),
            new Set(['ㄌ', 'ㄖ']),
            new Set(['ㄐ', 'ㄑ']),
            new Set(['ㄑ', 'ㄒ'])
        ];

        const CLOSE_FINAL_GROUPS = [
            new Set(['ㄣ', 'ㄥ']),
            new Set(['ㄢ', 'ㄤ']),
            new Set(['ㄧㄣ', 'ㄧㄥ'])
        ];

        function splitZhuyinSyllable(value) {
            const syllable = normalizeZhuyinSyllable(value);
            if (!syllable) {
                return { initial: '', final: '' };
            }

            const first = syllable[0];
            if (ZHUYIN_INITIALS.has(first)) {
                return {
                    initial: first,
                    final: syllable.slice(1)
                };
            }

            return {
                initial: '',
                final: syllable
            };
        }

        function inSameCloseGroup(a, b, groups) {
            if (!a || !b || a === b) return false;

            return groups.some(group => group.has(a) && group.has(b));
        }

        function isConservativeCloseSyllable(a, b) {
            a = normalizeZhuyinSyllable(a);
            b = normalizeZhuyinSyllable(b);

            if (!a || !b || a === b) {
                return false;
            }

            const left = splitZhuyinSyllable(a);
            const right = splitZhuyinSyllable(b);

            /*
             * Case A：韻母完全相同，只差一組常見近音聲母。
             * 例：ㄑㄧㄡ / ㄐㄧㄡ
             */
            if (
                left.final &&
                left.final === right.final &&
                inSameCloseGroup(left.initial, right.initial, CLOSE_INITIAL_GROUPS)
            ) {
                return true;
            }

            /*
             * Case B：聲母完全相同，只差一組常見近音韻母。
             * 例：ㄌㄧㄣ / ㄌㄧㄥ（是否救援仍要通過整題的嚴格條件）
             */
            if (
                left.initial === right.initial &&
                inSameCloseGroup(left.final, right.final, CLOSE_FINAL_GROUPS)
            ) {
                return true;
            }

            return false;
        }

        function zhuyinSequenceScore(spokenZhuyin, targetZhuyin) {
            if (!spokenZhuyin.length || !targetZhuyin.length) {
                return 0;
            }

            const spokenJoined = spokenZhuyin.join('');
            const targetJoined = targetZhuyin.join('');
            const wholeStringScore = stringSimilarity(spokenJoined, targetJoined);
            const maxCount = Math.max(spokenZhuyin.length, targetZhuyin.length);

            let syllableTotal = 0;

            for (let i = 0; i < maxCount; i++) {
                syllableTotal += stringSimilarity(
                    spokenZhuyin[i] || '',
                    targetZhuyin[i] || ''
                );
            }

            const syllableScore = syllableTotal / maxCount;

            /*
             * 仍維持既有 70% 每音節 + 30% 整體的核心分數。
             * 近音救援不直接混進這個分數，避免整體判分全面變鬆。
             */
            return Math.round(
                syllableScore * 0.7 +
                wholeStringScore * 0.3
            );
        }

        function analyzeConservativePhoneticRescue(bestWindow, targetZhuyin) {
            const targetLength = targetZhuyin.length;

            /*
             * 兩音節名稱錯一個音就等於錯一半，因此完全不使用近音救援。
             * 至少三音節才有資格。
             */
            if (
                targetLength < 3 ||
                bestWindow.length !== targetLength
            ) {
                return {
                    eligible: false,
                    exactCount: 0,
                    closeCount: 0,
                    mismatchCount: Math.max(bestWindow.length, targetLength)
                };
            }

            let exactCount = 0;
            let closeCount = 0;
            let mismatchCount = 0;

            for (let i = 0; i < targetLength; i++) {
                const spoken = normalizeZhuyinSyllable(bestWindow[i]);
                const target = normalizeZhuyinSyllable(targetZhuyin[i]);

                if (spoken === target) {
                    exactCount++;
                    continue;
                }

                mismatchCount++;

                if (isConservativeCloseSyllable(spoken, target)) {
                    closeCount++;
                }
            }

            /*
             * 最嚴格條件：
             * - 只有 1 個音節不同
             * - 那 1 個必須是已知近音
             * - 其他所有音節完全一致
             */
            const eligible =
                mismatchCount === 1 &&
                closeCount === 1 &&
                exactCount === targetLength - 1;

            return {
                eligible,
                exactCount,
                closeCount,
                mismatchCount
            };
        }

        function getBestZhuyinScore(spokenZhuyin, targetZhuyin) {
            if (!spokenZhuyin.length || !targetZhuyin.length) {
                return {
                    score: 0,
                    bestWindow: []
                };
            }

            const targetLength = targetZhuyin.length;
            let bestScore = 0;
            let bestWindow = spokenZhuyin;

            /*
             * 容許使用者說「答案是皮卡丘」、「我猜皮卡丘」等句型。
             * 如果辨識句子比較長，就找其中最像答案的一段。
             */
            if (spokenZhuyin.length >= targetLength) {
                for (
                    let start = 0;
                    start <= spokenZhuyin.length - targetLength;
                    start++
                ) {
                    const window = spokenZhuyin.slice(start, start + targetLength);
                    const score = zhuyinSequenceScore(window, targetZhuyin);

                    if (score > bestScore) {
                        bestScore = score;
                        bestWindow = window;
                    }
                }
            } else {
                bestScore = zhuyinSequenceScore(spokenZhuyin, targetZhuyin);
            }

            return {
                score: Math.round(bestScore),
                bestWindow
            };
        }

        function evaluateTranscript(transcript, pokemon) {
            const cleanText = cleanRecognizedText(transcript);
            const targetZhuyin = getTargetZhuyin(pokemon);

            if (!cleanText) {
                return {
                    transcript,
                    cleanText,
                    score: 0,
                    rawScore: 0,
                    spokenZhuyin: [],
                    targetZhuyin,
                    bestWindow: [],
                    exactTextMatch: false,
                    exactZhuyinMatch: false,
                    phoneticRescue: false,
                    matchType: 'empty'
                };
            }

            /*
             * 如果語音服務直接辨識出了正確寶可夢名稱，
             * 或句子裡包含正確名稱，直接視為 100。
             */
            const normalizedTargetName = normalizeNameForComparison(pokemon.name);

            if (
                normalizedTargetName &&
                cleanText.includes(normalizedTargetName)
            ) {
                return {
                    transcript,
                    cleanText,
                    score: 100,
                    rawScore: 100,
                    spokenZhuyin: recognizedTextToZhuyin(cleanText),
                    targetZhuyin,
                    bestWindow: targetZhuyin,
                    exactTextMatch: true,
                    exactZhuyinMatch: true,
                    phoneticRescue: false,
                    matchType: 'exact-text'
                };
            }

            if (!pinyinFn) {
                return {
                    transcript,
                    cleanText,
                    score: 0,
                    rawScore: 0,
                    spokenZhuyin: [],
                    targetZhuyin,
                    bestWindow: [],
                    exactTextMatch: false,
                    exactZhuyinMatch: false,
                    phoneticRescue: false,
                    matchType: 'pinyin-unavailable'
                };
            }

            const spokenZhuyin = recognizedTextToZhuyin(cleanText);
            const result = getBestZhuyinScore(spokenZhuyin, targetZhuyin);

            const exactZhuyinMatch =
                result.bestWindow.length === targetZhuyin.length &&
                targetZhuyin.length > 0 &&
                result.bestWindow.every(
                    (value, index) =>
                        normalizeZhuyinSyllable(value) ===
                        normalizeZhuyinSyllable(targetZhuyin[index])
                );

            if (exactZhuyinMatch) {
                return {
                    transcript,
                    cleanText,
                    score: 100,
                    rawScore: result.score,
                    spokenZhuyin,
                    targetZhuyin,
                    bestWindow: result.bestWindow,
                    exactTextMatch: false,
                    exactZhuyinMatch: true,
                    phoneticRescue: false,
                    matchType: 'exact-zhuyin'
                };
            }

            const rescue = analyzeConservativePhoneticRescue(
                result.bestWindow,
                targetZhuyin
            );

            /*
             * 近音救援固定只拉到 91：
             * 足以跨過 90 的正確門檻，但不偽裝成 100 分。
             * 且只有非常嚴格的「長名稱只差一個已知近音」才會觸發。
             */
            const finalScore = rescue.eligible
                ? Math.max(result.score, 91)
                : result.score;

            return {
                transcript,
                cleanText,
                score: finalScore,
                rawScore: result.score,
                spokenZhuyin,
                targetZhuyin,
                bestWindow: result.bestWindow,
                exactTextMatch: false,
                exactZhuyinMatch: false,
                phoneticRescue: rescue.eligible,
                phoneticDetails: rescue,
                matchType: rescue.eligible ? 'phonetic-rescue' : 'similarity'
            };
        }

        /* =========================================================
         * SpeechRecognition Session - V16 Production
         * ========================================================= */

        function isCurrentSession(session) {
            return activeSession === session;
        }

        function clearSessionTimers(session) {
            if (!session) return;

            [
                'preSpeechTimer',
                'recordingTimer',
                'speechEndTimer',
                'audioStopWatchdogTimer',
                'resultWaitTimer',
                'endGraceTimer',
                'hardLimitTimer',
                'abortSettleTimer',
                'earlyDecisionTimer'
            ].forEach(key => {
                clearTimeout(session[key]);
                session[key] = null;
            });
        }

        function normalizeCandidateKey(transcript) {
            return String(transcript || '')
                .replace(/[\s，。！？、,.!?：:；;「」『』（）()【】\[\]]+/g, '')
                .trim();
        }

        function addCandidate(session, candidate) {
            if (!session || !candidate || !candidate.transcript) return;

            const transcript = String(candidate.transcript).trim();
            const key = normalizeCandidateKey(transcript);
            if (!key) return;

            let entry = session.candidateMap.get(key);

            if (!entry) {
                entry = {
                    transcript,
                    sources: new Set(),
                    seenCount: 0,
                    finalSeen: false,
                    interimSeen: false,
                    bestConfidence: null
                };
                session.candidateMap.set(key, entry);
            }

            entry.seenCount++;
            entry.sources.add(candidate.source || 'UNKNOWN');

            if (candidate.isFinal) entry.finalSeen = true;
            if (candidate.isInterim) entry.interimSeen = true;

            if (
                typeof candidate.confidence === 'number' &&
                (
                    entry.bestConfidence === null ||
                    candidate.confidence > entry.bestConfidence
                )
            ) {
                entry.bestConfidence = candidate.confidence;
            }
        }

        function buildFullUtteranceCandidates(event) {
            if (!event || !event.results || !event.results.length) {
                return [];
            }

            let beams = [{
                transcript: '',
                confidenceTotal: 0,
                confidenceCount: 0,
                rankPenalty: 0
            }];

            let allFinal = true;
            let anyResult = false;

            for (let r = 0; r < event.results.length; r++) {
                const result = event.results[r];
                if (!result || !result.length) continue;

                anyResult = true;
                if (!result.isFinal) allFinal = false;

                const alternatives = [];

                for (let i = 0; i < result.length && i < MAX_ALTERNATIVES; i++) {
                    const alt = result[i];
                    const transcript =
                        alt && alt.transcript
                            ? alt.transcript.trim()
                            : '';

                    if (!transcript) continue;

                    alternatives.push({
                        transcript,
                        confidence:
                            typeof alt.confidence === 'number'
                                ? alt.confidence
                                : null,
                        rank: i
                    });
                }

                if (!alternatives.length) continue;

                const next = [];

                for (const beam of beams) {
                    for (const alt of alternatives) {
                        const hasConfidence =
                            typeof alt.confidence === 'number';

                        next.push({
                            transcript:
                                `${beam.transcript} ${alt.transcript}`.trim(),
                            confidenceTotal:
                                beam.confidenceTotal +
                                (hasConfidence ? alt.confidence : 0),
                            confidenceCount:
                                beam.confidenceCount +
                                (hasConfidence ? 1 : 0),
                            rankPenalty:
                                beam.rankPenalty + alt.rank
                        });
                    }
                }

                next.sort((a, b) => {
                    if (a.rankPenalty !== b.rankPenalty) {
                        return a.rankPenalty - b.rankPenalty;
                    }

                    const ac = a.confidenceCount
                        ? a.confidenceTotal / a.confidenceCount
                        : 0;
                    const bc = b.confidenceCount
                        ? b.confidenceTotal / b.confidenceCount
                        : 0;

                    return bc - ac;
                });

                beams = next.slice(0, MAX_UTTERANCE_CANDIDATES);
            }

            if (!anyResult) return [];

            return beams.map(beam => ({
                transcript: beam.transcript,
                confidence:
                    beam.confidenceCount
                        ? beam.confidenceTotal / beam.confidenceCount
                        : null,
                source: allFinal ? 'FULL_FINAL' : 'FULL_MIXED',
                isFinal: allFinal,
                isInterim: !allFinal
            }));
        }

        function captureRecognitionResult(session, event) {
            if (!session || session.finished || session.cancelled) return;

            if (event && event.results) {
                for (
                    let resultIndex = 0;
                    resultIndex < event.results.length;
                    resultIndex++
                ) {
                    const result = event.results[resultIndex];
                    if (!result) continue;

                    for (
                        let i = 0;
                        i < result.length && i < MAX_ALTERNATIVES;
                        i++
                    ) {
                        const alt = result[i];
                        const transcript =
                            alt && alt.transcript
                                ? alt.transcript.trim()
                                : '';

                        if (!transcript) continue;

                        addCandidate(session, {
                            transcript,
                            confidence:
                                typeof alt.confidence === 'number'
                                    ? alt.confidence
                                    : null,
                            source:
                                result.isFinal
                                    ? 'FINAL_SEGMENT'
                                    : 'INTERIM_SEGMENT',
                            isFinal: Boolean(result.isFinal),
                            isInterim: !result.isFinal
                        });
                    }
                }
            }

            buildFullUtteranceCandidates(event)
                .forEach(candidate => addCandidate(session, candidate));
        }

        function evaluateSessionCandidates(session) {
            const rows = [];

            for (const entry of session.candidateMap.values()) {
                const evaluation = evaluateTranscript(
                    entry.transcript,
                    session.targetPokemon
                );

                rows.push({
                    ...evaluation,
                    sources: Array.from(entry.sources),
                    seenCount: entry.seenCount,
                    finalSeen: entry.finalSeen,
                    interimSeen: entry.interimSeen,
                    confidence: entry.bestConfidence
                });
            }

            rows.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;

                if (
                    Number(b.exactTextMatch) !==
                    Number(a.exactTextMatch)
                ) {
                    return (
                        Number(b.exactTextMatch) -
                        Number(a.exactTextMatch)
                    );
                }

                if (
                    Number(b.exactZhuyinMatch) !==
                    Number(a.exactZhuyinMatch)
                ) {
                    return (
                        Number(b.exactZhuyinMatch) -
                        Number(a.exactZhuyinMatch)
                    );
                }

                if (Number(b.finalSeen) !== Number(a.finalSeen)) {
                    return Number(b.finalSeen) - Number(a.finalSeen);
                }

                if (b.seenCount !== a.seenCount) {
                    return b.seenCount - a.seenCount;
                }

                return (b.confidence || 0) - (a.confidence || 0);
            });

            return rows;
        }

        function selectSessionEvidence(session, evaluations) {
            if (!evaluations.length) {
                return {
                    selected: null,
                    reason: 'NO_CANDIDATE'
                };
            }

            const exactStrong = evaluations.find(item =>
                (item.exactTextMatch || item.exactZhuyinMatch) &&
                (item.finalSeen || item.seenCount >= 2)
            );

            if (exactStrong) {
                return {
                    selected: exactStrong,
                    reason:
                        exactStrong.exactTextMatch
                            ? 'EXACT_TEXT_CONFIRMED'
                            : 'EXACT_ZHUYIN_CONFIRMED'
                };
            }

            const bestFinal =
                evaluations.find(item => item.finalSeen) || null;

            if (
                bestFinal &&
                bestFinal.score >= SCORE_CORRECT
            ) {
                return {
                    selected: bestFinal,
                    reason: 'BEST_FINAL_OVER_THRESHOLD'
                };
            }

            const best = evaluations[0];

            const stableHighCandidate =
                best.score >= SCORE_CORRECT &&
                (
                    best.seenCount >= 2 ||
                    (
                        bestFinal &&
                        bestFinal.score >= SCORE_CLOSE
                    )
                );

            if (stableHighCandidate) {
                return {
                    selected: best,
                    reason: 'SESSION_POOL_HIGH_CONFIDENCE'
                };
            }

            return {
                selected: bestFinal || best,
                reason:
                    bestFinal
                        ? 'BEST_FINAL_BELOW_THRESHOLD'
                        : 'BEST_AVAILABLE_BELOW_THRESHOLD'
            };
        }

        function applyFinalDecision(session, selected, reason) {
            if (
                !session ||
                session.resultHandled ||
                session.cancelled
            ) {
                return false;
            }

            session.resultHandled = true;
            session.userMessageHandled = true;
            session.resultSource = reason;

            if (!selected) {
                setStatus(
                    '⏸️ 沒有收到可判斷的語音文字，請再試一次。',
                    'retry'
                );
                return true;
            }

            const success =
                currentPokemon === session.targetPokemon &&
                selected.score >= SCORE_CORRECT;

            if (success) {
                setStatus(
                    `🎉 太棒了！答案是「${session.targetPokemon.name}」！`,
                    'success'
                );
                revealAnswer();
            } else if (selected.score >= SCORE_CLOSE) {
                setStatus(
                    '😊 差一點點，再試一次！',
                    'close'
                );
            } else {
                setStatus(
                    isReadingMode
                        ? '💪 糟糕，再試著唸一次唷！'
                        : '💪 糟糕，再試著拼一次唷！',
                    'retry'
                );
            }

            return true;
        }

        function finalizeRecognitionDecision(
            session,
            reason = 'session finalize'
        ) {
            if (
                !session ||
                session.resultHandled ||
                session.cancelled
            ) {
                return false;
            }

            const evaluations =
                evaluateSessionCandidates(session);

            const selection =
                selectSessionEvidence(session, evaluations);

            return applyFinalDecision(
                session,
                selection.selected,
                selection.reason
            );
        }

        /*
         * V16 Fast Decision
         * 有把握就提早判；不確定才繼續聽。
         */
        function getBestFinalEvaluation(session) {
            const evaluations =
                evaluateSessionCandidates(session);

            const bestFinal =
                evaluations.find(item => item.finalSeen) || null;

            return {
                evaluations,
                bestFinal
            };
        }

        function finishFastSuccess(session, reason) {
            if (
                !session ||
                session.finished ||
                session.cancelled ||
                session.resultHandled
            ) {
                return false;
            }

            const applied =
                finalizeRecognitionDecision(session, reason);

            if (applied) {
                requestStop(
                    session,
                    reason,
                    false
                );
            }

            return applied;
        }

        function scheduleFastDecision(
            session,
            delayMs,
            reason,
            mode = 'success'
        ) {
            if (
                !session ||
                session.finished ||
                session.cancelled ||
                session.resultHandled
            ) {
                return;
            }

            clearTimeout(session.earlyDecisionTimer);

            session.earlyDecisionTimer = setTimeout(() => {
                if (
                    session.finished ||
                    session.cancelled ||
                    session.resultHandled
                ) {
                    return;
                }

                const { bestFinal } =
                    getBestFinalEvaluation(session);

                if (!bestFinal) return;

                if (mode === 'success') {
                    if (
                        bestFinal.score >= SCORE_CORRECT
                    ) {
                        finishFastSuccess(
                            session,
                            reason
                        );
                    }
                    return;
                }

                const targetLength =
                    getTargetZhuyin(
                        session.targetPokemon
                    ).length;

                const spokenLength =
                    Array.isArray(bestFinal.spokenZhuyin)
                        ? bestFinal.spokenZhuyin.length
                        : 0;

                if (
                    bestFinal.finalSeen &&
                    (
                        spokenLength >= targetLength ||
                        String(
                            bestFinal.cleanText || ''
                        ).length >= targetLength
                    )
                ) {
                    requestStop(
                        session,
                        reason,
                        true
                    );
                }
            }, delayMs);
        }

        function considerFastDecision(session) {
            if (
                !session ||
                session.finished ||
                session.cancelled ||
                session.resultHandled ||
                session.stopRequested
            ) {
                return;
            }

            const { bestFinal } =
                getBestFinalEvaluation(session);

            if (!bestFinal) return;

            if (
                bestFinal.exactTextMatch ||
                bestFinal.exactZhuyinMatch
            ) {
                clearTimeout(
                    session.earlyDecisionTimer
                );

                finishFastSuccess(
                    session,
                    bestFinal.exactTextMatch
                        ? 'fast exact-text final'
                        : 'fast exact-zhuyin final'
                );
                return;
            }

            if (
                bestFinal.score >= SCORE_CORRECT
            ) {
                scheduleFastDecision(
                    session,
                    FAST_FINAL_CONFIRM_MS,
                    'fast high-score final',
                    'success'
                );
                return;
            }

            const targetLength =
                getTargetZhuyin(
                    session.targetPokemon
                ).length;

            const spokenLength =
                Array.isArray(bestFinal.spokenZhuyin)
                    ? bestFinal.spokenZhuyin.length
                    : 0;

            if (
                spokenLength >= targetLength ||
                String(
                    bestFinal.cleanText || ''
                ).length >= targetLength
            ) {
                scheduleFastDecision(
                    session,
                    FINAL_BELOW_THRESHOLD_SETTLE_MS,
                    'complete final settled below threshold',
                    'stop-only'
                );
            }
        }

        function finishSession(session, options = {}) {
            if (!session || session.finished) return;

            session.finished = true;
            clearSessionTimers(session);

            if (isCurrentSession(session)) {
                activeSession = null;
                setMicBusy(false);
            }

            if (
                !session.cancelled &&
                !session.resultHandled &&
                !session.userMessageHandled &&
                !options.keepStatus
            ) {
                setStatus('⏸️ 沒有收到可用的語音辨識結果，再試一次唷！', 'retry');
            }

            session.recognition = null;
        }

        function forceAbortSession(session, reason = 'watchdog') {
            if (!session || session.finished || !session.recognition) return;

            if (!session.abortRequested) {
                session.abortRequested = true;

                try {
                    session.recognition.abort();
                } catch (error) {
                }
            }

            clearTimeout(session.abortSettleTimer);
            session.abortSettleTimer = setTimeout(() => {
                if (!session.finished) {
                    if (!session.cancelled && !session.resultHandled) {
                        finalizeRecognitionDecision(session, `abort settle: ${reason}`);
                    }
                    finishSession(session, { keepStatus: true });
                }
            }, ABORT_SETTLE_MS);
        }

        function startHardSessionWatchdog(session) {
            clearTimeout(session.hardLimitTimer);
            session.hardLimitTimer = setTimeout(() => {
                if (session.finished) return;

                if (!session.resultHandled && !session.cancelled) {
                    finalizeRecognitionDecision(session, 'hard session limit');
                }

                forceAbortSession(session, 'hard session limit');
            }, HARD_SESSION_LIMIT_MS);
        }

        function startAudioStopWatchdog(session) {
            clearTimeout(session.audioStopWatchdogTimer);
            session.audioStopWatchdogTimer = setTimeout(() => {
                if (session.finished || session.audioEnded || session.serviceEnded) return;

                if (!session.resultHandled && !session.cancelled) {
                    finalizeRecognitionDecision(session, 'audio stop watchdog');
                }

                forceAbortSession(session, 'audio stop watchdog');
            }, AUDIO_STOP_WATCHDOG_MS);
        }

        function requestStop(session, reason = 'timer', updateMessage = true) {
            if (
                !session ||
                session.finished ||
                session.serviceEnded ||
                !session.recognition ||
                session.stopRequested
            ) {
                return;
            }

            session.stopRequested = true;
            session.stopReason = reason;
            clearTimeout(session.preSpeechTimer);
            clearTimeout(session.recordingTimer);
            clearTimeout(session.speechEndTimer);

            if (updateMessage && !session.cancelled) {
                setStatus('⏳ 已收到完整答案，正在做最後確認...');
                setMicBusy(true, '⏳ 判斷中...');
            }

            try {
                session.recognition.stop();
            } catch (error) {
                finalizeRecognitionDecision(session, 'stop() threw');
                forceAbortSession(session, 'stop() threw');
                return;
            }

            startAudioStopWatchdog(session);
        }

        function cancelActiveRecognition(reason = 'cancel', silent = false) {
            const session = activeSession;
            if (!session || session.finished) return;

            session.cancelled = true;
            session.userMessageHandled = true;
            session.stopReason = reason;
            forceAbortSession(session, reason);

            if (!silent) {
                setStatus('⏸️ 錄音已取消。', 'retry');
            }
        }

        function scheduleResultWaitAfterAudioEnd(session) {
            clearTimeout(session.resultWaitTimer);
            session.resultWaitTimer = setTimeout(() => {
                if (session.finished || session.resultHandled || session.cancelled) return;

                finalizeRecognitionDecision(session, 'audioend result settle timeout');
                forceAbortSession(session, 'result settle complete');
            }, RESULT_WAIT_AFTER_AUDIO_MS);
        }

        function createRecognitionSession() {
            if (!SpeechRecognition || !currentPokemon) return null;

            const recognition = new SpeechRecognition();
            const session = {
                id: ++sessionSerial,
                recognition,
                createdAt: performance.now(),
                targetPokemon: currentPokemon,
                started: false,
                audioStarted: false,
                audioEnded: false,
                speechStarted: false,
                speechEnded: false,
                serviceEnded: false,
                stopRequested: false,
                stopReason: '',
                abortRequested: false,
                resultHandled: false,
                finalResultHandled: false,
                userMessageHandled: false,
                cancelled: false,
                finished: false,
                resultSource: '',
                candidateMap: new Map(),
                recordingLimitMs: getSpeechRecordingLimitMs(currentPokemon),
                preSpeechTimer: null,
                recordingTimer: null,
                speechEndTimer: null,
                audioStopWatchdogTimer: null,
                resultWaitTimer: null,
                endGraceTimer: null,
                hardLimitTimer: null,
                abortSettleTimer: null,
                earlyDecisionTimer: null
            };

            recognition.lang = 'zh-TW';
            recognition.interimResults = true;
            recognition.maxAlternatives = MAX_ALTERNATIVES;

            /*
             * V16 保留 continuous=true：
             * continuous=true 讓慢速分段講話有機會繼續產生下一段結果。
             * 若瀏覽器實作不完整，並改善慢速、分段發音時被提早切斷的情況。
             */
            recognition.continuous = true;

            recognition.onstart = () => {
                if (!isCurrentSession(session) || session.cancelled) return;

                session.started = true;

                setStatus('👂 麥克風已開啟，請正常把完整答案說完');
                setMicBusy(true, '⏹️ 錄音中...');

                clearTimeout(session.preSpeechTimer);
                session.preSpeechTimer = setTimeout(() => {
                    if (!session.speechStarted && !session.finished) {
                        session.userMessageHandled = true;
                        setStatus('👂 還沒有聽到說話聲，再試一次唷！', 'retry');
                        requestStop(session, '等待說話逾時', false);
                    }
                }, WAIT_FOR_SPEECH_MS);

                startHardSessionWatchdog(session);
            };

            recognition.onaudiostart = () => {
                session.audioStarted = true;
            };

            recognition.onsoundstart = () => {
                clearTimeout(session.speechEndTimer);
            };

            recognition.onsoundend = () => {
            };

            recognition.onspeechstart = () => {
                const firstSpeechStart = !session.speechStarted;
                session.speechStarted = true;
                session.speechEnded = false;

                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.speechEndTimer);

                /* 只在第一次真正說話時啟動整題最大說話時間。 */
                if (firstSpeechStart) {
                    clearTimeout(session.recordingTimer);
                    session.recordingTimer = setTimeout(() => {
                        requestStop(
                            session,
                            `speechstart 後 ${session.recordingLimitMs}ms 最大收音窗`,
                            true
                        );
                    }, session.recordingLimitMs);
                }

                if (isCurrentSession(session) && !session.cancelled) {
                    setStatus('🎙️ 正在收音，請把完整答案說完');
                }
            };

            recognition.onspeechend = () => {
                session.speechEnded = true;

                if (isCurrentSession(session) && !session.cancelled) {
                    setStatus(`⏳ 偵測到停頓，保留 ${SPEECH_END_GRACE_MS / 1000} 秒等待後續語音...`);
                }

                /*
                 * V16：靜音窗縮短為 1.5 秒。
                 * 若期間 Safari 又送 soundstart / speechstart，倒數仍會被取消。
                 */
                clearTimeout(session.speechEndTimer);
                session.speechEndTimer = setTimeout(() => {
                    if (!session.finished && !session.cancelled && !session.stopRequested) {
                        requestStop(session, 'speechend 後靜音窗結束', true);
                    }
                }, SPEECH_END_GRACE_MS);
            };

            recognition.onaudioend = () => {
                session.audioEnded = true;

                clearTimeout(session.audioStopWatchdogTimer);
                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.recordingTimer);
                clearTimeout(session.speechEndTimer);

                if (!session.resultHandled && !session.cancelled) {
                    setStatus('⏳ 收音完成，正在做最後確認...');
                    scheduleResultWaitAfterAudioEnd(session);
                }
            };

            recognition.onresult = event => {
                /*
                 * 每次有新結果，先取消前一次的早停倒數。
                 * 代表瀏覽器還在更新辨識內容，應以最新候選重新評估。
                 */
                clearTimeout(session.earlyDecisionTimer);

                captureRecognitionResult(session, event);

                if (!isCurrentSession(session) || session.cancelled) {
                    return;
                }

                considerFastDecision(session);

                if (!session.resultHandled && !session.stopRequested) {
                    setStatus('🎙️ 已收到辨識結果，正在確認是否可以立即判斷...');
                }
            };

            recognition.onnomatch = () => {
                if (!isCurrentSession(session) || session.cancelled) return;
                requestStop(session, 'nomatch', true);
            };

            recognition.onerror = event => {
                const errorName = event && event.error ? event.error : 'unknown';
                console.warn('[SpeechRecognition error]', errorName);

                if (!isCurrentSession(session) || session.cancelled) return;
                if (errorName === 'aborted' && session.abortRequested) return;

                if (
                    errorName === 'not-allowed' ||
                    errorName === 'service-not-allowed'
                ) {
                    session.userMessageHandled = true;
                    setStatus('🎤 請允許瀏覽器使用麥克風後再試一次。', 'error');
                } else if (errorName === 'audio-capture') {
                    session.userMessageHandled = true;
                    setStatus('🎤 找不到可用的麥克風，請檢查裝置設定。', 'error');
                } else if (errorName === 'network') {
                    session.userMessageHandled = true;
                    setStatus('🌐 語音服務連線失敗，請檢查網路後再試一次。', 'error');
                }

                if (!session.resultHandled && session.candidateMap.size) {
                    finalizeRecognitionDecision(session, `error: ${errorName}`);
                }

                if (errorName !== 'aborted') {
                    forceAbortSession(session, `error: ${errorName}`);
                }
            };

            recognition.onend = () => {
                session.serviceEnded = true;

                clearTimeout(session.audioStopWatchdogTimer);
                clearTimeout(session.resultWaitTimer);
                clearTimeout(session.preSpeechTimer);
                clearTimeout(session.recordingTimer);
                clearTimeout(session.speechEndTimer);

                if (!isCurrentSession(session)) {
                    clearSessionTimers(session);
                    return;
                }

                if (session.cancelled) {
                    finishSession(session, { keepStatus: true });
                    return;
                }

                /*
                 * Safari 偶爾 onend 與最後 result 的順序會很接近。
                 * 再保留短暫 settle window，之後才做「整個 session」最終判斷。
                 */
                clearTimeout(session.endGraceTimer);
                session.endGraceTimer = setTimeout(() => {
                    if (session.finished) return;

                    if (!session.resultHandled) {
                        finalizeRecognitionDecision(session, 'recognition onend settle');
                    }

                    finishSession(session, { keepStatus: true });
                }, END_RESULT_GRACE_MS);
            };

            return session;
        }

        function startRecognition() {
            if (!SpeechRecognition || !currentPokemon) return;

            if (typeof pinyinFn !== 'function') {
                setStatus(
                    '❌ 注音判分模組目前不可用，已停止本次錄音，避免誤判。',
                    'error'
                );
                micBtn.disabled = true;
                micBtn.textContent = '⚠️ 判分模組未載入';
                return;
            }

            if (activeSession && !activeSession.finished) return;

            const session = createRecognitionSession();
            if (!session) return;

            activeSession = session;
            setStatus('🎤 麥克風準備中...');
            setMicBusy(true, '🎤 準備中...');

            try {
                session.recognition.start();
            } catch (error) {
                console.warn('[SpeechRecognition start failed]', error);
                session.userMessageHandled = true;
                setStatus('🎤 麥克風還沒準備好，請再按一次。', 'retry');
                finishSession(session, { keepStatus: true });
            }
        }

        /* =========================================================
         * 按鈕
         * ========================================================= */

        modeBtn.addEventListener('click', () => {
            if (isChangingQuestion) return;

            pendingMicStart = false;
            isReadingMode = !isReadingMode;
            modeBtn.textContent = isReadingMode
                ? '切換為：拼音模式'
                : '切換為：認字模式';
            loadRandomPokemon();
        });

        micBtn.addEventListener('click', () => {
            if (isChangingQuestion) {
                pendingMicStart = true;
                setStatus('⏳ 正在換題，完成後會自動開啟麥克風...');
                return;
            }

            startRecognition();
        });

        showBtn.addEventListener('click', () => {
            if (isChangingQuestion || !currentPokemon) return;

            pendingMicStart = false;
            cancelActiveRecognition('查看答案', true);
            revealAnswer();
            setStatus(`答案是：${currentPokemon.name}`);
        });

        nextBtn.addEventListener('click', () => {
            if (isChangingQuestion) return;

            pendingMicStart = false;
            loadRandomPokemon();
        });

        /* =========================================================
         * iPad / iPhone Safari 背景切換保護
         * ========================================================= */

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && activeSession && !activeSession.finished) {
                activeSession.cancelled = true;
                activeSession.userMessageHandled = true;
                forceAbortSession(activeSession, 'visibilitychange');
            }
        });

        window.addEventListener('pagehide', () => {
            if (activeSession && !activeSession.finished) {
                activeSession.cancelled = true;
                activeSession.userMessageHandled = true;
                forceAbortSession(activeSession, 'pagehide');
            }
        });
    </script>
</body>
</html>
